<!doctype html>
<!--
  Toy Paint — a minimal local paint page for testing Noah's colour-swatch / unlabeled-toolbar fix
  (Noah/perception/color.cjs, Noah/perception/observer.cjs _addTitledButtons/_addColorSwatches).

  Deliberately built with jspaint.app's EXACT problem structure: every tool is a <div title="..."> with no
  ARIA role, and every colour is a <div data-color="rgb(...)"> with a plain <canvas> inside and no text at all.
  Chromium's accessibility tree reports both as role "generic" - invisible to any accessibility-tree-based agent
  until Noah's observer.cjs promotes them by title / colour, exactly as verified in
  Noah/bench/integration/paint-swatch-check.cjs.

  Kept to plain 2D canvas drawing (no WebGL, no GPU compositing tricks) on purpose: jspaint.app itself crashes
  this Electron/Chromium build outright, so this page exists to let the fix be tested on something that will
  actually render.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toy Paint</title>
<style>
  html,body{margin:0;height:100%;background:#c8c8c8;font:13px/1.3 "Segoe UI",Arial,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #toolbar{display:flex;gap:4px;padding:6px;background:#ddd;border-bottom:1px solid #999}
  .tool{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid #999;border-radius:4px;background:#eee;cursor:pointer;font-size:18px;user-select:none}
  .tool.selected{background:#8ab4f8;border-color:#4c7fd6}
  #main{display:flex;flex:1;min-height:0}
  #canvasWrap{flex:1;background:#888;display:flex;align-items:center;justify-content:center}
  canvas.main-canvas{background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4);cursor:crosshair}
  #side{width:150px;background:#ddd;border-left:1px solid #999;padding:8px;display:flex;flex-direction:column;gap:10px}
  #palette{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .swatch{width:28px;height:28px;border:1px solid #666;border-radius:3px;cursor:pointer}
  .swatch canvas{width:100%;height:100%;display:block;border-radius:2px}
  .swatch.selected{outline:3px solid #333;outline-offset:1px}
  #current{display:flex;align-items:center;gap:8px}
  #current .swatch{width:36px;height:36px}
  #status{padding:4px 8px;background:#eee;border-top:1px solid #999;font-size:12px;color:#444}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="tool selected" title="Pencil" data-tool="pencil">✏️</div>
    <div class="tool" title="Line" data-tool="line">╱</div>
    <div class="tool" title="Rectangle" data-tool="rectangle">▭</div>
    <div class="tool" title="Ellipse" data-tool="ellipse">◯</div>
    <div class="tool" title="Fill With Color" data-tool="fill">🪣</div>
    <div class="tool" title="Eraser" data-tool="eraser">🧹</div>
    <div class="tool" title="Clear Canvas" data-tool="clear">🗑️</div>
  </div>
  <div id="main">
    <div id="canvasWrap"><canvas class="main-canvas" title="Drawing Canvas" width="700" height="460"></canvas></div>
    <div id="side">
      <div id="current">
        <span>Color:</span>
        <div class="swatch" id="currentSwatch"><canvas width="36" height="36"></canvas></div>
      </div>
      <div id="palette"></div>
    </div>
  </div>
  <div id="status">Pencil selected · black</div>
</div>
<script>
(function () {
  "use strict";
  var PALETTE = [
    "rgb(0,0,0)", "rgb(128,128,128)", "rgb(192,192,192)", "rgb(255,255,255)",
    "rgb(128,0,0)", "rgb(255,0,0)", "rgb(255,128,64)", "rgb(255,128,0)",
    "rgb(128,128,0)", "rgb(255,255,0)", "rgb(0,128,0)", "rgb(0,255,0)",
    "rgb(0,128,128)", "rgb(0,255,255)", "rgb(0,0,128)", "rgb(0,0,255)",
    "rgb(128,0,128)", "rgb(255,0,255)", "rgb(128,64,0)", "rgb(210,180,140)"
  ];
  var canvas = document.querySelector("canvas.main-canvas");
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  var state = { tool: "pencil", color: "rgb(0,0,0)", drawing: false, start: null, snapshot: null };
  var statusEl = document.getElementById("status");
  var strokeCount = 0;

  function paintSwatchCanvas(cv, color) {
    var c = cv.getContext("2d");
    c.fillStyle = color; c.fillRect(0, 0, cv.width, cv.height);
  }

  function setStatus() {
    statusEl.textContent = state.tool[0].toUpperCase() + state.tool.slice(1) + " selected · current colour " + state.color;
  }

  // A committed stroke only ever changes canvas PIXELS - no DOM node, no page text, nothing an automation agent's
  // cheap, reliable page-state checks (URL/title/text/DOM size/focus) can see. Without this, verifying a draw
  // worked falls back entirely on diffing a screenshot, which is not always available (an occluded or backgrounded
  // window can't be captured). Bumping a visible counter turns every real stroke into an ordinary, always-detectable
  // text change - the same kind of signal a normal button click already produces.
  function noteStroke(label) {
    strokeCount++;
    statusEl.textContent = label + " · " + state.color + " · stroke " + strokeCount;
  }

  // ---- palette (jspaint's exact shape: a plain div, data-color attribute, a canvas child, no text)
  var paletteEl = document.getElementById("palette");
  PALETTE.forEach(function (color) {
    var sw = document.createElement("div");
    sw.className = "swatch";
    sw.setAttribute("data-color", color);
    var cv = document.createElement("canvas");
    cv.width = 28; cv.height = 28;
    paintSwatchCanvas(cv, color);
    sw.appendChild(cv);
    sw.addEventListener("click", function () {
      state.color = color;
      document.querySelectorAll("#palette .swatch").forEach(function (s) { s.classList.remove("selected"); });
      sw.classList.add("selected");
      paintSwatchCanvas(document.querySelector("#currentSwatch canvas"), color);
      setStatus();
    });
    paletteEl.appendChild(sw);
  });
  paintSwatchCanvas(document.querySelector("#currentSwatch canvas"), state.color);

  // ---- toolbar (jspaint's exact shape: a plain div, title attribute, no role/aria-label)
  document.querySelectorAll(".tool").forEach(function (t) {
    t.addEventListener("click", function () {
      var tool = t.getAttribute("data-tool");
      if (tool === "clear") {
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        statusEl.textContent = "Canvas cleared";
        return;
      }
      state.tool = tool;
      document.querySelectorAll(".tool").forEach(function (x) { x.classList.remove("selected"); });
      t.classList.add("selected");
      setStatus();
    });
  });

  // ---- drawing
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener("pointerdown", function (e) {
    var p = pos(e);
    state.drawing = true;
    state.start = p;
    ctx.strokeStyle = state.color;
    ctx.fillStyle = state.color;
    ctx.lineWidth = state.tool === "eraser" ? 24 : 3;
    if (state.tool === "fill") {
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      state.drawing = false;
      noteStroke("Filled");
      return;
    }
    if (state.tool === "pencil" || state.tool === "eraser") {
      if (state.tool === "eraser") ctx.strokeStyle = "#fff";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    } else {
      state.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!state.drawing) return;
    var p = pos(e);
    if (state.tool === "pencil" || state.tool === "eraser") {
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (state.snapshot) {
      ctx.putImageData(state.snapshot, 0, 0);
      drawShape(state.start, p);
    }
  });

  function drawShape(a, b) {
    // Rectangle/ellipse are drawn FILLED (a shape tool in a real paint program offers filled/outline/both; this
    // toy keeps one behaviour, filled, since "draw a blue sky" or "a filled blue circle" means a solid patch of
    // colour, not just an outline). Line has no interior, so it only ever strokes.
    ctx.beginPath();
    if (state.tool === "line") {
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    } else if (state.tool === "rectangle") {
      ctx.fillRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    } else if (state.tool === "ellipse") {
      var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2, rx = Math.abs(b.x - a.x) / 2, ry = Math.abs(b.y - a.y) / 2;
      ctx.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  window.addEventListener("pointerup", function (e) {
    if (!state.drawing) return;
    state.drawing = false;
    if (state.tool !== "pencil" && state.tool !== "eraser" && state.snapshot) {
      ctx.putImageData(state.snapshot, 0, 0);
      drawShape(state.start, pos(e));
      state.snapshot = null;
      noteStroke("Drew " + state.tool);
    } else if (state.tool === "pencil" || state.tool === "eraser") {
      noteStroke(state.tool === "eraser" ? "Erased" : "Drew pencil stroke");
    }
  });

  setStatus();
})();
</script>
</body>
</html>
