<!DOCTYPE html>
<html>
<head>
  <title>Google Login Blocked</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #0a0f1f, #05070d);
      color: white;
      overflow: hidden;
    }

    /* 🔥 Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #00eaff33, transparent 70%);
      top: -100px;
      right: -100px;
      filter: blur(80px);
    }

    .card {
      position: relative;
      width: 520px;
      padding: 35px;

      background: rgba(15, 20, 40, 0.75);
      backdrop-filter: blur(20px);

      border-radius: 18px;

      border: 1px solid rgba(0, 234, 255, 0.2);

      box-shadow:
        0 0 25px rgba(0, 234, 255, 0.25),
        0 0 60px rgba(0, 234, 255, 0.15);

      text-align: center;

      animation: fadeIn 0.5s ease;
    }

    h1 {
      color: #ff00f2;
      font-size: 24px;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #ff00c8;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
      margin: 10px 0;
      line-height: 1.6;
    }

    .highlight {
      color: #ff00ea;
      font-weight: 500;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 12px 18px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;

      background: linear-gradient(135deg, #ff00c8, #ecbdff);
      color: white;

      transition: 0.25s ease;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
    }

    button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 20px #ea00ff;
    }

    .secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 234, 255, 0.3);
    }

    .secondary:hover {
      background: rgba(0, 234, 255, 0.1);
    }

    /* ⚡ Animated glow line */
    .glow-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff00d4, transparent);
      margin: 20px 0;
      animation: glowMove 2s linear infinite;
    }

    @keyframes glowMove {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

  </style>
</head>

<body>

<div class="card">

  <h1>🚫 Google Sign-In Disabled</h1>

  <div class="glow-line"></div>

  <p>
    Jonah does not support Google Login due to
    <span class="highlight">privacy and safe browsing policies</span>.
  </p>

  <p>
    ✅ You can still <span class="highlight">create a Google account</span>  
    and continue using it normally.
  </p>

  <div class="buttons">
    <button onclick="createAccount()">
      Create Google Account
    </button>

    <button class="secondary" onclick="goBack()">
      Go Back
    </button>
  </div>

</div>

<script>
function createAccount() {
    window.location.href = "https://accounts.google.com/signup";
}

function goBack() {
    history.back();
}
</script>

</body>
</html>
