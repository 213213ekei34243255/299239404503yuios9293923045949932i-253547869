# Builds Jonah for Windows (installer) and macOS (Intel + Apple Silicon) and attaches everything - including the files the in-app
# updater reads - to a DRAFT GitHub Release. A draft is visible only to people with write access to this repository: nothing is public,
# and the updater inside installed apps ignores drafts, until you press "Publish release" on GitHub yourself.
#
# Runs when a tag like v1.4.2 is pushed, or by hand from the Actions tab ("Run workflow"). The tag must match the version in package.json.
#
# SIGNING (each part is automatic and only happens when its repository secrets exist; without them that part is built unsigned):
#   macOS   secrets CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application certificate as a base64 .p12) sign the app. APPLE_API_KEY_CONTENT,
#           APPLE_API_KEY_ID, APPLE_API_ISSUER (App Store Connect API key) also notarize it, with a time limit (build/notarize.cjs). The
#           Apple submission id is printed in the build log and in the run summary. If Apple is still working at the limit, the build still
#           succeeds with a signed-but-not-yet-notarized app.
#   Windows secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE and
#           AZURE_SIGN_PUBLISHER sign the Windows installer through Azure Artifact Signing (not available in every country).
# Unsigned, Windows shows a "SmartScreen" warning on first run and macOS asks to allow the app once ("Open Anyway").
# macOS only installs updates for signed apps: updater.cjs keeps the Mac app in "tell the user, open this page" mode until that is switched on.

name: Release (draft) - Windows + macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            mac: false
            runner: windows-latest
            artifact: Jonah-windows
            build: npx electron-builder --win nsis-web --x64 --publish never
            # nsis-web: a small installer (the .exe) that downloads the big app package (the .nsis.7z) from the release while installing
            paths: |
              dist/nsis-web/*.exe
              dist/nsis-web/*.nsis.7z
              dist/nsis-web/latest.yml
          # An Intel machine matters: packages such as ffmpeg-static download the binary for the machine they are installed on,
          # so each Mac architecture is built on its own native runner.
          - id: mac-x64
            mac: true
            runner: macos-15-intel
            artifact: Jonah-mac-x64
            build: npx electron-builder --mac dmg zip --x64 --publish never
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - id: mac-arm64
            mac: true
            runner: macos-15
            artifact: Jonah-mac-arm64
            build: npx electron-builder --mac dmg zip --arm64 --publish never
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keys are never committed (the repository is public). Optional repository secrets become files inside the app, exactly as in
      # the Mac build workflow. A key inside an app is extractable by anyone who has the app, so only use keys that can live there.
      - name: Add the runtime key from repository secrets (optional)
        env:
          JONAH_PROXY_KEY: ${{ secrets.JONAH_PROXY_KEY }}
        run: |
          if [ -n "$JONAH_PROXY_KEY" ]; then
            printf 'JONAH_PROXY_KEY=%s\n' "$JONAH_PROXY_KEY" > .env
            echo "JONAH_PROXY_KEY secret found: added to the app"
          else
            echo "No JONAH_PROXY_KEY secret set: building without it"
          fi

      - name: Add the market-data keys from repository secrets (optional)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -n "$TWELVEDATA_API_KEY$COINGECKO_API_KEY" ]; then
            node -e 'require("fs").writeFileSync("market-keys.js", "window.JONAH_MARKET_KEYS = " + JSON.stringify({ twelveData: process.env.TWELVEDATA_API_KEY || "", coinGecko: process.env.COINGECKO_API_KEY || "" }) + ";\n")'
            echo "market-data keys added to the app"
          else
            echo "No market-data secrets: the stock and crypto boards will run without keys"
          fi

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${V}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${V}"; exit 1
          fi

      # macOS notarization: the App Store Connect API key (.p8) is written to a file only if the secret exists.
      - name: Write the notarization API key (Mac only, only if the secret is set)
        if: ${{ matrix.mac }}
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "notarization API key written"
          else
            echo "No APPLE_API_KEY_CONTENT / APPLE_API_KEY_ID secret: building without notarization"
          fi

      # Windows signing: patched into package.json for THIS build only (never committed) when all the Azure secrets are present.
      - name: Turn on Windows signing (only if the Azure Artifact Signing secrets are set)
        if: ${{ !matrix.mac }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGN_ENDPOINT" ] && [ -n "$AZURE_SIGN_ACCOUNT" ] && [ -n "$AZURE_SIGN_PROFILE" ] && [ -n "$AZURE_SIGN_PUBLISHER" ]; then
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.build.win.azureSignOptions={publisherName:process.env.AZURE_SIGN_PUBLISHER,endpoint:process.env.AZURE_SIGN_ENDPOINT,codeSigningAccountName:process.env.AZURE_SIGN_ACCOUNT,certificateProfileName:process.env.AZURE_SIGN_PROFILE};fs.writeFileSync("package.json",JSON.stringify(p))'
            echo "Windows signing is ON for this build (Azure Artifact Signing)"
          else
            echo "Azure signing secrets are not all set: building the Windows installer unsigned"
          fi

      - name: Build
        timeout-minutes: 45
        env:
          # The Apple certificate must never reach the Windows job (electron-builder would try to use it as a Windows certificate).
          CSC_LINK: ${{ matrix.mac && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.mac && secrets.CSC_KEY_PASSWORD || '' }}
          # electron-builder looks for a signing identity whenever this is true; only allow it when there is a certificate to sign with.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.mac && secrets.CSC_LINK && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ matrix.mac && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.mac && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.mac && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ !matrix.mac && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ !matrix.mac && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ !matrix.mac && secrets.AZURE_CLIENT_SECRET || '' }}
        run: ${{ matrix.build }}

      - name: What was built
        # No pipe into head: GitHub runs bash with pipefail, and head closing the pipe early would fail this step.
        run: |
          ls -la dist
          ls -la dist/nsis-web 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can write to the repository, and it only ever creates or updates a DRAFT release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"

          # Gather every file into one flat folder. Both Mac builds write a file called latest-mac.yml and only one can be kept: keep
          # the Intel one (the Mac app does not install updates by itself - it only compares versions and opens this page).
          mkdir -p out
          rm -f artifacts/Jonah-mac-arm64/latest-mac.yml
          find artifacts -type f -exec cp {} out/ \;

          # The small Mac installer: the script itself (for the one-line Terminal command) and a zip of it that keeps its "executable"
          # flag (a browser strips that flag from a bare .command file, so a double-click would not work).
          cp build/install-jonah-mac.command out/install-jonah-mac.command
          chmod +x out/install-jonah-mac.command
          mkdir -p zipwork && cp out/install-jonah-mac.command "zipwork/Install Jonah.command" && chmod +x "zipwork/Install Jonah.command"
          (cd zipwork && zip -X ../out/Jonah-Mac-Installer.zip "Install Jonah.command")

          # Checksums of everything (the Mac installer verifies the download against this before installing it).
          (cd out && sha256sum * | grep -v ' SHA256SUMS.txt$' > SHA256SUMS.txt)
          ls -la out; cat out/SHA256SUMS.txt

          cat > notes.md <<'NOTES'
          Plans, billing and Google sign-in build. Not code-signed.

          **Windows** - download `Jonah-Web-Setup-*.exe` (a few MB). It downloads the rest of Jonah while it installs, so you need an internet connection. Windows may show a SmartScreen warning: More info, then Run anyway. Later updates install themselves.

          **macOS** - download `Jonah-Mac-Installer.zip` (a few KB), open it, and double-click `Install Jonah` (the first time: right-click, Open, Open - it is not signed). Or paste this in Terminal:
          `curl -fsSL https://github.com/OWNER_REPO/releases/latest/download/install-jonah-mac.command | bash`
          It picks Apple Silicon or Intel for you, downloads Jonah, checks it, and installs it. Prefer a normal download? Use the `.dmg` for your Mac (`x64` = Intel, `arm64` = Apple Silicon).
          NOTES
          sed -i "s#OWNER_REPO#${GITHUB_REPOSITORY}#" notes.md

          FILES=$(ls out/* | tr '\n' ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its files"
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Jonah ${V}" --notes-file notes.md $FILES
          fi
          echo "Draft release $TAG is ready. It is NOT public: open Releases on GitHub and press Publish release when you are happy."
