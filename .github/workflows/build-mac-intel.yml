# Builds the Intel (x86_64) macOS DMG on a real Mac machine. BUILD ONLY: nothing here publishes, releases or tags anything -
# the DMG is attached to the run as a downloadable artifact (Actions tab -> the run -> "Artifacts") and expires after 14 days.
#
# Runs on every push to the `mac-intel-build` branch, or by hand from the Actions tab ("Run workflow").

name: Build macOS Intel DMG (no release)

on:
  push:
    branches: [mac-intel-build]
  workflow_dispatch:

# Read-only: the job cannot create a release, push, or change the repository.
permissions:
  contents: read

concurrency:
  group: mac-intel-build
  cancel-in-progress: true

jobs:
  dmg:
    # macos-15-intel is GitHub's last Intel (x86_64) Mac runner (available until Aug 2027). An Intel machine matters: packages such
    # as ffmpeg-static download the binary for the machine they are installed on, so an Intel build must be installed on Intel.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app reads its search-proxy key from a .env file. Keys are never committed: if you want the DMG to carry one, add a
      # repository secret named JONAH_PROXY_KEY (Settings -> Secrets and variables -> Actions). Without it the DMG still builds, but
      # web search, news and shopping (all through jonahbrowser.store) will be refused. (A key inside an app is extractable by anyone
      # who has the app.)
      - name: Add the runtime key from repository secrets (optional)
        env:
          JONAH_PROXY_KEY: ${{ secrets.JONAH_PROXY_KEY }}
        run: |
          if [ -n "$JONAH_PROXY_KEY" ]; then
            printf 'JONAH_PROXY_KEY=%s\n' "$JONAH_PROXY_KEY" > .env
            echo "JONAH_PROXY_KEY secret found: added to the app"
          else
            echo "No JONAH_PROXY_KEY secret set: building without it"
          fi

      # The home page's stock / crypto boards read their keys from market-keys.js (never committed: the repository is public).
      # Repository secrets TWELVEDATA_API_KEY and COINGECKO_API_KEY become that file inside the DMG.
      - name: Add the market-data keys from repository secrets (optional)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -n "$TWELVEDATA_API_KEY$COINGECKO_API_KEY" ]; then
            node -e 'require("fs").writeFileSync("market-keys.js", "window.JONAH_MARKET_KEYS = " + JSON.stringify({ twelveData: process.env.TWELVEDATA_API_KEY || "", coinGecko: process.env.COINGECKO_API_KEY || "" }) + ";\n")'
            echo "market-data keys added to the app"
          else
            echo "No TWELVEDATA_API_KEY / COINGECKO_API_KEY secrets: the stock and crypto boards will run without keys"
          fi

      # Signing needs a "Developer ID Application" certificate exported as a .p12, base64-encoded into the
      # CSC_LINK secret (CSC_KEY_PASSWORD is its export password). Notarization needs an App Store Connect API
      # key: the .p8 file's contents in APPLE_API_KEY_CONTENT, plus APPLE_API_KEY_ID and APPLE_API_ISSUER. None
      # of these are required - without them this still builds the same unsigned DMG as before.
      - name: Write the notarization API key (only if the secret is set)
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "notarization API key written"
          else
            echo "No APPLE_API_KEY_CONTENT secret: building without notarization"
          fi

      - name: Build the Intel DMG (signed + notarized if secrets are set, otherwise unsigned as before)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder looks for a signing identity whenever CSC_LINK is set; only force "unsigned" when it isn't.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: What was built
        run: ls -la dist/*.dmg

      - name: Keep the DMG as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jonah-mac-intel-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
