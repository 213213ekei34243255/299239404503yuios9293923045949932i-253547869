# Apple Silicon (arm64) build of Jonah with the DEVELOPER-ACCESS SIGN-IN, unlimited (no plans or limits), version 2.0.5 - a separate, duplicate build line.
# BUILD ONLY: nothing here publishes, releases or tags anything. The DMG is attached to the run as a downloadable artifact (Actions tab -> the run -> "Artifacts"), 14 days.
#
# Runs on every push to the `mac-silicon-login` branch, or by hand from the Actions tab.
#
# SIGNING (automatic, only when the repository secrets exist; otherwise that part is skipped and the DMG is unsigned):
#   CSC_LINK + CSC_KEY_PASSWORD (Developer ID Application certificate as a base64 .p12) sign the app.
#   APPLE_API_KEY_CONTENT + APPLE_API_KEY_ID + APPLE_API_ISSUER (+ APPLE_TEAM_ID) notarize it, with a time limit (build/notarize.cjs): if Apple is still working at the
#   limit the build still succeeds with a signed-but-not-yet-notarized app.
#
# THE SIGN-IN: the app asks for the developer-access login (accounts made in https://www.jonahbrowser.store/admin) on every launch. The licence server's address and
# PUBLIC key are written into the app by the step below: from the repository secrets LICENSE_KEY_ID / LICENSE_PUBLIC_KEY / LICENSE_SERVER_URL when they exist, else the
# values of the production signing key (public information, not secrets).

name: Build macOS Apple Silicon - login (signed, no release)

on:
  push:
    branches: [mac-silicon-login]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-silicon-login
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the runtime key from repository secrets (optional)
        env:
          JONAH_PROXY_KEY: ${{ secrets.JONAH_PROXY_KEY }}
        run: |
          if [ -n "$JONAH_PROXY_KEY" ]; then
            printf 'JONAH_PROXY_KEY=%s\n' "$JONAH_PROXY_KEY" > .env
            echo "JONAH_PROXY_KEY secret found: added to the app"
          else
            echo "No JONAH_PROXY_KEY secret set: building without it"
          fi

      - name: Add the market-data keys from repository secrets (optional)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -n "$TWELVEDATA_API_KEY$COINGECKO_API_KEY" ]; then
            node -e 'require("fs").writeFileSync("market-keys.js", "window.JONAH_MARKET_KEYS = " + JSON.stringify({ twelveData: process.env.TWELVEDATA_API_KEY || "", coinGecko: process.env.COINGECKO_API_KEY || "" }) + ";\n")'
            echo "market-data keys added to the app"
          else
            echo "No market-data secrets: the stock and crypto boards will run without keys"
          fi

      - name: Write the sign-in settings into the app
        env:
          LICENSE_KEY_ID: ${{ secrets.LICENSE_KEY_ID }}
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
        run: |
          node -e '
            const e = process.env;
            const cfg = { serverUrl: e.LICENSE_SERVER_URL || "https://www.jonahbrowser.store", publicKeys: [{ kid: e.LICENSE_KEY_ID || "kf27542eb16", spki: e.LICENSE_PUBLIC_KEY || "MCowBQYDK2VwAyEAH8TMF04SAvbpDFGXw_Mnr35rMV0vAy8uUfmpn5f1C4g" }] };
            require("fs").writeFileSync("license-config.generated.json", JSON.stringify(cfg, null, 2) + "\n");
            console.log("sign-in settings written: server " + cfg.serverUrl + ", key " + cfg.publicKeys[0].kid + (e.LICENSE_KEY_ID ? " (from the secrets)" : " (the production key)"));
          '

      - name: Check this build is the unlimited version (billing off) with the sign-in on
        run: |
          node -e '
            const fs = require("fs");
            const ent = JSON.parse(fs.readFileSync("entitlements.config.json", "utf8"));
            if (ent.enabled !== false) { console.error("entitlements.config.json must say enabled:false in this build"); process.exit(1); }
            const v = require("./package.json").version;
            if (v !== "2.0.5") { console.error("expected version 2.0.5, found " + v); process.exit(1); }
            const { loadLicenseConfig } = require("./license-config.cjs");
            const c = loadLicenseConfig({ isPackaged: true, platform: "darwin", arch: "arm64", env: {}, argv: [], dir: process.cwd() });
            if (!c.required || !c.configured) { console.error("the sign-in must be required and configured: " + JSON.stringify({ required: c.required, configured: c.configured })); process.exit(1); }
            console.log("billing off, version " + v + ", sign-in required and configured");
          '

      - name: Write the notarization API key (only if the secret is set)
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "notarization API key written"
          else
            echo "No APPLE_API_KEY_CONTENT / APPLE_API_KEY_ID secret: building without notarization"
          fi

      - name: Build the Apple Silicon DMG (signed when the certificate secret exists)
        timeout-minutes: 60
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: What was built
        run: ls -la dist/*.dmg

      - name: Keep the DMG as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jonah-mac-silicon-login-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
