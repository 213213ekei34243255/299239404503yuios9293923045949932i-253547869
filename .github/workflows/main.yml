name: Build Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Windows x64
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jonah-Windows-x64
          path: |
            dist/*.exe
            dist/*.msi

  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build macOS
        run: |
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jonah-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
