<!DOCTYPE html>
<!-- Jonah's book menu (Electron: index.html #toolsMenu + .tools-menu / .tools-menu-item), shown by the book button. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme-defaults.css">
<script src="theme-tokens.js"></script>
<script src="theme-core.js"></script>
<script src="js/theme-apply.js"></script>
<style>
  html, body { margin: 0; background: rgb(16, 12, 26); overflow: hidden; }
  .tools-menu {
    min-width: 210px;
    background: rgba(var(--p-20-14-30), 0.97);
    border-radius: 14px;
    box-shadow: inset 0 0 0 1px rgba(255,105,180,0.5);
    padding: 6px;
    font-family: Arial, sans-serif;
  }
  .tools-menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    color: rgb(var(--p-233-233-255));
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }
  .tools-menu-item:hover { background: rgba(255,105,180,0.28); color: #fff; }
</style>
</head>
<body>
<div class="tools-menu" role="menu">
  <div class="tools-menu-item" role="menuitem" data-act="cite">Cite this page</div>
  <div class="tools-menu-item" role="menuitem" data-act="hub:game">Game Hub</div>
  <div class="tools-menu-item" role="menuitem" data-act="hub:creator">Creator Studio</div>
  <div class="tools-menu-item" role="menuitem" data-act="hub:aesthetic">Aesthetic Lab</div>
  <div class="tools-menu-item" role="menuitem" data-act="study:today">Study Hub</div>
  <div class="tools-menu-item" role="menuitem" data-act="study:focus">Focus Timer</div>
  <div class="tools-menu-item" role="menuitem" data-act="study:cards">Flashcards</div>
  <div class="tools-menu-item" role="menuitem" data-act="study:ai">AI Tutor</div>
  <div class="tools-menu-item" role="menuitem" data-act="calc">Calculator</div>
  <div class="tools-menu-item" role="menuitem" data-act="abacus">Abacus</div>
  <div class="tools-menu-item" role="menuitem" data-act="formula">Formula Reference</div>
  <div class="tools-menu-item" role="menuitem" data-act="notes">Research Notes</div>
</div>
<script src="js/menu.js"></script>
</body>
</html>
