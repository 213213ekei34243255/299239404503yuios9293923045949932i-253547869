<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jonah</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sky-top:#05070d;
  --sky-mid:#0e131f;
  --sky-low:#171d2b;
  --cloud-dark:#1c2333;
  --cloud-mid:#2a3348;
  --cloud-light:rgba(255,255,255,0.06);
  --flash:#eaf1ff;
  --glass-bg:rgba(255,255,255,0.07);
  --glass-bg-strong:rgba(255, 255, 255, 0.055);
  --glass-border:rgba(255, 255, 255, 0.068);
  --text-bright:#ffffff;
  --text-muted:rgba(255,255,255,0.62);
  --rain-line:rgba(200,215,235,0.35);
}

body{
  margin:0;min-height:100vh;
  font-family:'Barlow',sans-serif;
  background:var(--sky-top);
  color:var(--text-bright);
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;overflow-y:auto;
  position:relative;
}

/* ── SKY / STORM BACKGROUND ── */
#sky-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(60,70,100,0.35) 0%, transparent 60%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%);
}
.cloud-layer{
  position:absolute;left:-20%;width:140%;
  background-repeat:no-repeat;
  filter:blur(18px);
  opacity:0.9;
}
.cloud-1{
  top:-8%;height:50%;
  background:
    radial-gradient(ellipse 30% 60% at 15% 40%, var(--cloud-mid) 0%, transparent 70%),
    radial-gradient(ellipse 40% 70% at 45% 30%, var(--cloud-dark) 0%, transparent 70%),
    radial-gradient(ellipse 35% 60% at 75% 45%, var(--cloud-mid) 0%, transparent 70%),
    radial-gradient(ellipse 25% 50% at 95% 35%, var(--cloud-dark) 0%, transparent 70%);
  animation:driftSlow 90s linear infinite;
}
.cloud-2{
  top:2%;height:38%;
  background:
    radial-gradient(ellipse 25% 55% at 25% 50%, rgba(20,25,38,0.9) 0%, transparent 70%),
    radial-gradient(ellipse 32% 60% at 60% 40%, rgba(30,37,54,0.9) 0%, transparent 70%),
    radial-gradient(ellipse 22% 45% at 88% 55%, rgba(20,25,38,0.9) 0%, transparent 70%);
  animation:driftSlow 60s linear infinite reverse;
  opacity:0.75;
}
@keyframes driftSlow{
  from{transform:translateX(0);}
  to{transform:translateX(15%);}
}

/* Lightning flash — confined to the cloud band near the top */
#lightning{
  position:absolute;top:0;left:0;width:100%;height:52%;
  background:radial-gradient(ellipse 60% 80% at 50% 10%, var(--flash) 0%, rgba(234,241,255,0.4) 25%, transparent 70%);
  opacity:0;mix-blend-mode:screen;
  pointer-events:none;
}

/* Rain canvas */
#rainCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}

/* Vignette + faint scanline for depth */
body::after{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.55) 0%, transparent 55%),
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.035) 3px,rgba(0,0,0,0.035) 4px);
  z-index:1;pointer-events:none;
}

/* ── MAIN CONTENT ── */
.content-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  width:100%;padding:60px 0 100px;
}

/* ── LOGO ── */
.logo-area{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:46px;margin-top:10px;
}
.wc-logo{
  width:min(560px,80vw);
  height:auto;object-fit:contain;
  filter:
    drop-shadow(0 0 35px rgba(180,200,255,0.25))
    drop-shadow(0 10px 30px rgba(0,0,0,0.6));
  animation:logoFloat 6s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

/* ── GLASS BASE (shared) ── */
.glass{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

/* ── SEARCH ── */
.search-container{width:640px;max-width:90%;position:relative;margin-bottom:36px;}
.search-box{
  width:100%;padding:18px 32px;
  border-radius:50px;
  border:1px solid var(--glass-border);
  font-size:16px;font-family:'Barlow',sans-serif;
  background:var(--glass-bg);
  color:#fff;outline:none;
  box-shadow:0 10px 40px rgba(0,0,0,0.35), inset 0 0 30px rgba(255,255,255,0.02);
  transition:0.4s;
  backdrop-filter:blur(22px);
  letter-spacing:0.5px;
}
.search-box::placeholder{color:rgba(255,255,255,0.35);}
.search-box:focus{
  border-color:rgba(255,255,255,0.35);
  box-shadow:0 10px 50px rgba(0,0,0,0.45), inset 0 0 30px rgba(255,255,255,0.04);
}
#homeSuggestions{
  position:fixed;
  background:rgba(14,18,30,0.92);
  backdrop-filter:blur(24px);
  border-radius:16px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  border:1px solid var(--glass-border);
  display:none;z-index:999999;
}
.home-suggestion-item{
  padding:13px 20px;color:rgba(255,255,255,0.7);
  cursor:pointer;font-family:'Barlow',sans-serif;font-size:15px;
  border-bottom:1px solid rgba(255,255,255,0.05);transition:0.2s;
}
.home-suggestion-item:hover{background:rgba(255,255,255,0.08);color:#fff;padding-left:28px;}

/* ── SHORTCUTS ── */
.shortcuts{margin-bottom:56px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.shortcut{
  width:92px;height:92px;border-radius:22px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  cursor:pointer;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:visible;
  box-shadow:0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px);
}
.shortcut:hover{
  transform:translateY(-10px) scale(1.08);
  background:var(--glass-bg-strong);
  border-color:rgba(255,255,255,0.3);
  box-shadow:0 18px 40px rgba(0,0,0,0.5);
}
.shortcut:active{transform:translateY(-2px) scale(1.02);}
.shortcut img{
  width:38px;height:38px;object-fit:contain;position:relative;z-index:1;
  transition:0.3s;filter:brightness(0);
}
.shortcut:hover img{transform:scale(1.12);}
.shortcut-label{
  position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif;font-size:9px;
  color:rgba(255,255,255,0.75);letter-spacing:2px;white-space:nowrap;
  opacity:0;transition:0.3s;text-transform:uppercase;
}
.shortcut:hover .shortcut-label{opacity:1;}
.sc-add{
  border:2px dashed var(--glass-border);
  font-size:26px;color:rgba(255,255,255,0.6);
}
.sc-add:hover{color:#fff;}

#addModal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;justify-content:center;align-items:center;
  z-index:9999;backdrop-filter:blur(8px);
}
#addModal>div{
  background:rgba(14,18,30,0.95);
  border:1px solid var(--glass-border);
  padding:32px;border-radius:20px;width:340px;text-align:center;
  box-shadow:0 10px 60px rgba(0,0,0,0.5);
}
#addModal h3{
  font-family:'Bebas Neue',sans-serif;font-size:22px;
  color:#fff;letter-spacing:4px;margin-bottom:16px;
}
#urlInput{
  width:90%;padding:12px 16px;border-radius:12px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.05);color:#fff;
  font-family:'Barlow',sans-serif;font-size:15px;outline:none;margin-top:8px;
}
#urlInput:focus{border-color:rgba(255,255,255,0.4);}
#addModal button{
  margin:10px 5px 0;padding:10px 24px;border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.08);color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-size:15px;
  cursor:pointer;transition:0.2s;letter-spacing:2px;
}
#addModal button:hover{background:rgba(255,255,255,0.16);}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:22px;
}
.section-header h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;letter-spacing:4px;
  color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,0.15);
}
.section-header::before{
  content:'';display:block;
  width:5px;height:26px;
  background:linear-gradient(180deg,rgba(255,255,255,0.8),rgba(255,255,255,0.15));
  border-radius:3px;
}

/* ── RADIO ── */
.radio-player{
  width:92%;max-width:1100px;
  margin-bottom:50px;
  padding:28px 32px;border-radius:20px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter:blur(26px);
  position:relative;overflow:hidden;
}
.radio-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.station-name{
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  color:#fff;letter-spacing:4px;
}
.live-indicator{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:3px;}
.live-dot{width:10px;height:10px;background:#cfe0ff;border-radius:50%;box-shadow:0 0 12px #cfe0ff;animation:liveBlink 1s infinite;}
@keyframes liveBlink{0%,100%{opacity:1;}50%{opacity:0.2;}}
.radio-controls{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
#playBtn{
  width:60px;height:60px;border-radius:50%;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.08);
  color:#fff;font-size:22px;cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.4);
  transition:0.2s;display:flex;align-items:center;justify-content:center;
  outline:none;
}
#playBtn:hover{background:rgba(255,255,255,0.16);}
#volume{flex:1;accent-color:#cfe0ff;min-width:80px;}
.wave{display:flex;align-items:flex-end;gap:5px;height:36px;}
.wave span{
  width:5px;height:8px;
  background:linear-gradient(180deg,#eaf1ff,#7f96c2);
  border-radius:3px;
  animation:waveB 1s infinite ease-in-out;
}
.wave span:nth-child(1){animation-delay:0s;}
.wave span:nth-child(2){animation-delay:0.1s;}
.wave span:nth-child(3){animation-delay:0.2s;}
.wave span:nth-child(4){animation-delay:0.3s;}
.wave span:nth-child(5){animation-delay:0.4s;}
.wave span:nth-child(6){animation-delay:0.5s;}
.wave span:nth-child(7){animation-delay:0.6s;}
@keyframes waveB{0%,100%{height:6px;opacity:0.4;}50%{height:32px;opacity:1;}}
#languageSelect{
  background:rgba(14,18,30,0.9);color:#fff;
  border:1px solid var(--glass-border);
  padding:9px 14px;border-radius:12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;
  transition:0.2s;letter-spacing:1px;
}
#languageSelect option{background:#0e131f;color:#fff;}
#liveSubtitles{
  margin-top:18px;padding:14px 20px;
  background:rgba(0,0,0,0.35);
  border-radius:12px;border:1px solid var(--glass-border);
  min-height:48px;overflow:hidden;display:flex;align-items:center;
}
#subtitleLine{
  display:flex;gap:7px;white-space:nowrap;overflow-x:auto;
  font-size:17px;font-family:'Barlow',sans-serif;
  color:rgba(255,255,255,0.85);letter-spacing:0.5px;
  scrollbar-width:none;
}
#subtitleLine::-webkit-scrollbar{display:none;}
.word{opacity:0;transform:translateY(6px);animation:wordIn 0.25s ease forwards;}
@keyframes wordIn{to{opacity:1;transform:translateY(0);}}

/* ── NEWS ── */
.news-section{width:92%;max-width:1100px;margin-bottom:50px;}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
.news-card{
  background:var(--glass-bg);
  border-radius:16px;overflow:hidden;cursor:pointer;
  border:1px solid var(--glass-border);
  box-shadow:0 12px 30px rgba(0,0,0,0.4);
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;
  backdrop-filter:blur(18px);
}
.news-card:hover{
  transform:translateY(-10px);
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
  border-color:rgba(255,255,255,0.3);
}
.news-card img{width:100%;height:170px;object-fit:cover;filter:saturate(0.9) brightness(0.9);transition:0.4s;display:block;}
.news-card:hover img{filter:saturate(1) brightness(1);}
.news-content{padding:16px 18px;}
.news-title{font-size:15px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,0.9);line-height:1.4;font-family:'Barlow',sans-serif;}
.news-source{
  font-size:10px;color:rgba(255,255,255,0.55);
  font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--sky-top);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#8fa2c4,#3a4a68);border-radius:10px;}
/* =======================
TOP OVERLAY
======================= */

#topOverlay{
    position:fixed;
    top:18px;          /* Pushes it to the very top */
    left:25px;
    right:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:9999;
    pointer-events:none;
}

#speakerToggle{

    width:48px;

    height:48px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    cursor:pointer;

    pointer-events:auto;

    transition:.25s;

}

#speakerToggle:hover{

    transform:scale(1.08);

}

#speakerToggle i{

    font-size:30px;

    color:white;

}

#tributeText{

    color:rgba(255,255,255,.8);

    font-family:'Barlow',sans-serif;

    font-size:15px;

    letter-spacing:.6px;

    text-shadow:0 0 10px rgba(0,0,0,.5);

}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// ── RAIN + LIGHTNING ──
(function(){
  const canvas=document.getElementById('rainCanvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);

  const DROPS=220;
  const drops=Array.from({length:DROPS},()=>({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    len:Math.random()*18+10,
    speed:Math.random()*6+8,
    drift:1.2+Math.random()*0.6,
    opacity:Math.random()*0.35+0.15
  }));

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineCap='round';
    drops.forEach(d=>{
      ctx.beginPath();
      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x - d.drift*3, d.y + d.len);
      ctx.strokeStyle=`rgba(200,215,235,${d.opacity})`;
      ctx.lineWidth=1;
      ctx.stroke();
      d.x -= d.drift;
      d.y += d.speed;
      if(d.y > H || d.x < -20){
        d.y = -20;
        d.x = Math.random()*(W+40);
      }
    });
    requestAnimationFrame(draw);
  }
  draw();

  // Lightning flashes, confined to the cloud band (#lightning element)
  const bolt=document.getElementById('lightning');
  function flash(){
    const flickers = 2 + Math.floor(Math.random()*2);
    let i=0;
    function doFlicker(){
      if(i>=flickers){bolt.style.opacity=0;scheduleNext();return;}
      bolt.style.transition='opacity 60ms ease-out';
      bolt.style.opacity = (0.5 + Math.random()*0.4).toFixed(2);
      setTimeout(()=>{
        bolt.style.opacity=0;
        i++;
        setTimeout(doFlicker, 80 + Math.random()*120);
      }, 70 + Math.random()*60);
    }
    doFlicker();
  }
  function scheduleNext(){
    const delay = 6000 + Math.random()*9000;
    setTimeout(flash, delay);
  }
  scheduleNext();
})();

// ── NAV ──
function go(url){window.location.href=url;}

// ── SHORTCUTS ──
function getFavicon(url){try{return`https://www.google.com/s2/favicons?sz=128&domain=${new URL(url).origin}`;}catch{return '';}}
function addShortcut(){document.getElementById("addModal").style.display="flex";}
function closeModal(){document.getElementById("addModal").style.display="none";}
document.getElementById("addModal").addEventListener("click",e=>{if(e.target.id==="addModal")closeModal();});
function createShortcut(url,icon){
  const div=document.createElement("div");div.className="shortcut";
  div.onclick=()=>window.open(url,"_self");
  div.addEventListener("contextmenu",e=>{e.preventDefault();if(confirm("Remove this shortcut?")){div.remove();removeShortcut(url);}});
  const img=document.createElement("img");img.src=icon;
  const label=document.createElement("span");label.className="shortcut-label";
  try{label.textContent=new URL(url).hostname.replace('www.','').split('.')[0];}catch{}
  div.appendChild(img);div.appendChild(label);
  document.querySelector(".shortcuts").insertBefore(div,document.querySelector(".sc-add"));
}
function saveShortcut(url,icon){
  let sc=JSON.parse(localStorage.getItem("wc26-sc"))||[];
  sc.push({url,icon});localStorage.setItem("wc26-sc",JSON.stringify(sc));
}
function removeShortcut(url){
  let sc=JSON.parse(localStorage.getItem("wc26-sc"))||[];
  localStorage.setItem("wc26-sc",JSON.stringify(sc.filter(s=>s.url!==url)));
}
(JSON.parse(localStorage.getItem("wc26-sc"))||[]).forEach(s=>createShortcut(s.url,s.icon));
async function confirmAdd(){
  let url=document.getElementById("urlInput").value.trim();
  if(!url)return;
  if(!url.startsWith("http"))url="https://"+url;
  const fav=getFavicon(url);
  createShortcut(url,fav);
  saveShortcut(url,fav);
  closeModal();document.getElementById("urlInput").value="";
}
document.getElementById("urlInput").addEventListener("keydown",e=>{if(e.key==="Enter")confirmAdd();});

// ── SEARCH ──
const homeInput=document.getElementById("homeSearch");
const homeBox=document.getElementById("homeSuggestions");
function positionHS(){const r=homeInput.getBoundingClientRect();homeBox.style.top=r.bottom+8+"px";homeBox.style.left=r.left+"px";homeBox.style.width=r.width+"px";}
async function fetchHS(q){try{const r=await fetch(`https://duckduckgo.com/ac/?q=${q}`);const d=await r.json();return d.map(x=>x.phrase);}catch{return[];}}
homeInput.addEventListener("input",async()=>{
  const v=homeInput.value.trim();if(!v){homeBox.style.display="none";return;}
  positionHS();let s=await fetchHS(v);s.unshift(`Search "${v}"`);homeBox.innerHTML="";
  s.slice(0,6).forEach(t=>{const d=document.createElement("div");d.className="home-suggestion-item";d.textContent=t;d.onclick=()=>{window.location.href="search.html?q="+encodeURIComponent(t);};homeBox.appendChild(d);});
  homeBox.style.display="block";
});
homeInput.addEventListener("keydown",e=>{if(e.key==="Enter"){window.location.href="search.html?q="+encodeURIComponent(homeInput.value.trim());}});
homeInput.addEventListener("blur",()=>{setTimeout(()=>homeBox.style.display="none",150);});
window.addEventListener("resize",positionHS);window.addEventListener("scroll",positionHS);

// ── SUBTITLES ──
const subtitleLine=document.getElementById("subtitleLine");
let queue=[],printing=false;
function processQueue(){
  if(printing)return;printing=true;
  const iv=setInterval(()=>{
    if(queue.length===0){clearInterval(iv);printing=false;return;}
    const w=queue.shift(),s=document.createElement("span");
    s.innerText=w+" ";s.className="word";subtitleLine.appendChild(s);
    if(subtitleLine.children.length>25)subtitleLine.removeChild(subtitleLine.firstChild);
    subtitleLine.scrollLeft=subtitleLine.scrollWidth;
  },140);
}
function receiveLiveText(text){queue.push(...text.split(" "));processQueue();}

const playBtn=document.getElementById("playBtn");
const volumeSlider=document.getElementById("volume");
const wave=document.querySelector(".wave");
let socket2;
try{socket2=new WebSocket("wss://hjjhjgh-l2px.onrender.com");}catch(e){}
const langMap={english:"en-US",spanish:"es",hindi:"hi-IN",tamil:"ta-IN",telugu:"te-IN",kannada:"kn-IN",malayalam:"ml-IN",arabic:"ar",chinese:"zh",japanese:"ja-JP",french:"fr",portuguese:"pt-BR",german:"de",russian:"ru",italian:"it"};

if(socket2)socket2.onmessage=ev=>{const d=JSON.parse(ev.data);if(d.text)receiveLiveText(d.text);};

const stations={

};

let _currentStationList = stations.english;
function startWatchdog(stationList) {
  _currentStationList = stationList;
  clearInterval(window._watchdog);
  window._watchdog = setInterval(() => {
    const dead = audio.readyState === 0 || audio.error ||
                 (!audio.paused && audio.buffered.length === 0);
    if (dead && isPlaying) {
      tryPlay(_currentStationList);
    }
  }, 8000);
}

const langSelect=document.getElementById("languageSelect");
langSelect.addEventListener("change",()=>{
  const l=langSelect.value;
  if(stations[l]){tryPlay(stations[l]);}
  else{loadRadioAPI(l);}
});
async function loadRadioAPI(lang){
  try{
    const r=await fetch(`https://de1.api.radio-browser.info/json/stations/bylanguage/${lang}`);
    const d=await r.json();
    const v=d.filter(s=>s.url_resolved&&(s.url_resolved.includes("mp3")||s.url_resolved.includes("aac")||s.url_resolved.includes("stream")));
    if(!v.length){useUltimateFallback();return;}
    tryPlay(v.slice(0,10));
  }catch{useUltimateFallback();}
}
let hls;
function tryPlay(list){
  let idx=0;
  function next(){
    if(idx>=list.length){useUltimateFallback();return;}
    const s=list[idx];const streamUrl=s.url||s.url_resolved;
    if(hls){hls.destroy();hls=null;}
    if(streamUrl.includes(".m3u8")){
      if(Hls.isSupported()){
        hls=new Hls();hls.loadSource(streamUrl);hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED,function(){
          audio.play();
          currentStation=s.name;
          updateStationUI();
          setPlayIcon(true);
          isPlaying=true;
          setWave(true);
          startSubtitles(streamUrl,langMap[langSelect.value]||"en-US");
          startWatchdog(list);
          audio.addEventListener('stalled', () => { if(hls) hls.startLoad(); });
        });
        hls.on(Hls.Events.ERROR,function(event,data){
          if(data.fatal){
            if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
              hls.startLoad();
            } else {
              idx++;next();
            }
          }
        });
      }else if(audio.canPlayType('application/vnd.apple.mpegurl')){
        audio.src=streamUrl;audio.addEventListener('loadedmetadata',()=>{
          audio.play();currentStation=s.name;updateStationUI();setPlayIcon(true);isPlaying=true;setWave(true);
          startSubtitles(streamUrl,langMap[langSelect.value]||"en-US");
          startWatchdog(list);
        });
      }else{idx++;next();}
    }else{
      audio.src=streamUrl;
      audio.play().then(()=>{
        currentStation=s.name;updateStationUI();setPlayIcon(true);isPlaying=true;setWave(true);
        startSubtitles(streamUrl,langMap[langSelect.value]||"en-US");
        startWatchdog(list);
      }).catch(()=>{idx++;next();});
    }
  }
  next();
}

function useUltimateFallback(){
  tryPlay(stations.english);
}

function updateStationUI(){document.getElementById("stationNameEl").innerText=currentStation||"Radio";}
function setPlayIcon(playing){const icon=playBtn.querySelector("i");if(icon)icon.className=playing?"bx bx-pause":"bx bx-play";icon.style.fontSize="24px";}
playBtn.addEventListener("click",()=>{
  if(!audio.src||audio.src===window.location.href){tryPlay(stations.english);return;}
  if(!isPlaying){audio.play();setPlayIcon(true);setWave(true);}
  else{audio.pause();setPlayIcon(false);setWave(false);}
  isPlaying=!isPlaying;
});
volumeSlider.addEventListener("input",()=>{audio.volume=volumeSlider.value;});

// ── NEWS ──
let pg=1,ldg=false;
const CT=30*60*1000;
function cacheValid(){const l=localStorage.getItem("wc26-newsTime");return l&&(Date.now()-l<CT);}
function fromCache(){const c=localStorage.getItem("wc26-news");if(c)renderNews(JSON.parse(c));}
function renderNews(a){const g=document.getElementById("newsGrid");g.innerHTML="";a.filter(x=>x.urlToImage).forEach(x=>g.appendChild(createCard(x)));}
async function loadNews(){
  if(cacheValid()){fromCache();return;}
  try{
    if(window.api&&window.api.getNews){
      const d=await window.api.getNews(1);
      if(d&&d.articles&&d.articles.length>0){
        localStorage.setItem("wc26-news",JSON.stringify(d.articles));
        localStorage.setItem("wc26-newsTime",Date.now());
        renderNews(d.articles);
      }else fromCache();
    }else fromCache();
  }catch{fromCache();}
}
function createCard(a){
  const c=document.createElement("div");c.className="news-card";
  const img=a.urlToImage||'';
  c.innerHTML=`<img src="${img}" onerror="this.style.display='none'"><div class="news-content"><div class="news-title">${a.title}</div><div class="news-source">${a.source.name}</div></div>`;
  c.onclick=()=>window.location.href=a.url;return c;
}
window.addEventListener("scroll",()=>{if(window.innerHeight+window.scrollY>=document.body.offsetHeight-200&&!ldg)loadMoreNews();});
async function loadMoreNews(){
  if(ldg||pg>=8)return;ldg=true;pg++;
  try{if(window.api&&window.api.getNews){const d=await window.api.getNews(pg);if(d&&d.articles){const g=document.getElementById("newsGrid");d.articles.forEach(a=>g.appendChild(createCard(a)));}}}
  catch(e){}ldg=false;
}
loadNews();setInterval(loadNews,1800000);
