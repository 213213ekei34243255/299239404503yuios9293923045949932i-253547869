<script>

function getFavicon(url) {
    let domain = new URL(url).origin;
    return `https://www.google.com/s2/favicons?sz=128&domain=${domain}`;
}

async function getDominantColor(imgUrl) {
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = imgUrl;

        img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            let r = 0, g = 0, b = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
                r += data[i];
                g += data[i+1];
                b += data[i+2];
                count++;
            }

            r = Math.floor(r / count);
            g = Math.floor(g / count);
            b = Math.floor(b / count);

            resolve(`rgb(${r},${g},${b})`);
        };
    });
}

function addShortcut() {
    document.getElementById("addModal").style.display = "flex";
}



function createShortcut(url, icon, color) {
    const div = document.createElement("div");
    div.className = "shortcut";
    div.style.background = color;

    div.onclick = () => window.open(url, "_self");

    // 👉 RIGHT CLICK DELETE
    div.addEventListener("contextmenu", (e) => {
        e.preventDefault();

        const confirmDelete = confirm("Remove this shortcut?");
        if (!confirmDelete) return;

        div.remove();
        removeShortcut(url);
    });

    const img = document.createElement("img");
    img.src = icon;

    div.appendChild(img);

    const container = document.querySelector(".shortcuts");
    const addBtn = document.querySelector(".add-btn");

    container.insertBefore(div, addBtn);
}

function saveShortcut(url, icon, color) {
    let shortcuts = JSON.parse(localStorage.getItem("shortcuts")) || [];
    shortcuts.push({ url, icon, color });
    localStorage.setItem("shortcuts", JSON.stringify(shortcuts));
}
function removeShortcut(url) {
    let shortcuts = JSON.parse(localStorage.getItem("shortcuts")) || [];

    shortcuts = shortcuts.filter(s => s.url !== url);

    localStorage.setItem("shortcuts", JSON.stringify(shortcuts));
}
function loadShortcuts() {
    let shortcuts = JSON.parse(localStorage.getItem("shortcuts")) || [];

    shortcuts.forEach(s => {
        createShortcut(s.url, s.icon, s.color);
    });
}

loadShortcuts();
function closeModal() {
    document.getElementById("addModal").style.display = "none";
}
document.getElementById("addModal").addEventListener("click", (e) => {
    if (e.target.id === "addModal") {
        closeModal();
    }
});

async function confirmAdd() {
    let url = document.getElementById("urlInput").value.trim();

    if (!url) return;

    if (!url.startsWith("http")) {
        url = "https://" + url;
    }

    const favicon = getFavicon(url);
    const color = await getDominantColor(favicon);

    createShortcut(url, favicon, color);
    saveShortcut(url, favicon, color);

    closeModal();
    document.getElementById("urlInput").value = "";
}
document.getElementById("urlInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") confirmAdd();
});
</script>
<script>
const homeInput = document.getElementById("homeSearch");
const homeBox = document.getElementById("homeSuggestions");

// 🔥 Position correctly
function positionHomeSuggestions() {
    const rect = homeInput.getBoundingClientRect();

    homeBox.style.top = rect.bottom + "px";
    homeBox.style.left = rect.left + "px";
    homeBox.style.width = rect.width + "px";
}

// 🔥 Fetch suggestions
async function fetchHomeSuggestions(query) {
    try {
        const res = await fetch(`https://duckduckgo.com/ac/?q=${query}`);
        const data = await res.json();
        return data.map(x => x.phrase);
    } catch {
        return [];
    }
}

// 🔥 Input listener
homeInput.addEventListener("input", async () => {
    const value = homeInput.value.trim();

    if (!value) {
        homeBox.style.display = "none";
        return;
    }

    positionHomeSuggestions();

    let suggestions = await fetchHomeSuggestions(value);

    suggestions.unshift(`Search "${value}"`);

    homeBox.innerHTML = "";

    suggestions.slice(0, 6).forEach(text => {
        const div = document.createElement("div");
        div.className = "home-suggestion-item";
        div.textContent = text;

        div.onclick = () => {
            const url = "search.html?q=" + encodeURIComponent(text);
            window.location.href = url;
        };
        

        homeBox.appendChild(div);
    });

    homeBox.style.display = "block";
});

// 🔥 Enter key
homeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const value = homeInput.value.trim();

        const url = "search.html?q=" + encodeURIComponent(value);

        window.location.href = url;
    }
});

// 🔥 Hide on blur
homeInput.addEventListener("blur", () => {
    setTimeout(() => homeBox.style.display = "none", 150);
});

// 🔥 Keep aligned
window.addEventListener("resize", positionHomeSuggestions);
window.addEventListener("scroll", positionHomeSuggestions);
</script>
<script>
// 🎧 SUBTITLE ENGINE
const subtitleLine = document.getElementById("subtitleLine");

let queue = [];
let printing = false;




// ⚡ PROCESS WORDS
function processQueue() {
    if (printing) return;
    printing = true;

    const interval = setInterval(() => {

        if (queue.length === 0) {
            clearInterval(interval);
            printing = false;
            return;
        }

        const word = queue.shift();

        const span = document.createElement("span");
        span.innerText = word;
        span.className = "word";

        subtitleLine.appendChild(span);

        // keep last 25 words only
        if (subtitleLine.children.length > 25) {
            subtitleLine.removeChild(subtitleLine.firstChild);
        }

        // auto scroll
        subtitleLine.scrollLeft = subtitleLine.scrollWidth;

    }, 140);
}

// 🔌 BACKEND HOOK (REAL DATA)
function receiveLiveText(text) {
    const words = text.split(" ");
    queue.push(...words);
    processQueue();
}
</script>

            showUser(payload);
        }
    } catch (err) {
        console.log("Waiting for login...");
    }
}

// 🧠 SHOW USER
function showUser(user) {
    document.getElementById("loginBtn").style.display = "none";

    document.getElementById("userInfo").style.display = "flex";
    document.getElementById("userName").innerText = user.name;
    document.getElementById("userPic").src = user.picture;
}

    if (saved) {
        const user = JSON.parse(saved);
        showUser(user);
    }
}

});

<script>
let cache = null;
let lastFetch = 0;

async function loadLeague() {
    const container = document.getElementById("sportsList");

    try {
        const now = Date.now();

        // 🧠 CACHE (5 minutes)
        if (cache && (now - lastFetch < 5 * 60 * 1000)) {
            console.log("⚡ Using cache");
            render(cache);
            return;
        }

        container.innerHTML = "Loading...";

        let allMatches = [];

        // ⚠️ LIMIT CALLS (only 1–2 max)
        const live = await window.sportsAPI.getCustom("fixtures?live=all");
        const recent = await window.sportsAPI.getCustom("fixtures?last=10");

        if (live?.response) allMatches.push(...live.response);
        if (recent?.response) allMatches.push(...recent.response);

        console.log("🔥 TOTAL:", allMatches.length);

        if (allMatches.length === 0) {
            container.innerHTML = "⚠️ No matches available";
            return;
        }

        // 🔥 CLEAN
        allMatches = allMatches.filter(m =>
            m?.teams?.home?.name && m?.teams?.away?.name
        );

        // 🔥 SORT
        allMatches.sort((a, b) =>
            new Date(b.fixture.date) - new Date(a.fixture.date)
        );

        // 💾 SAVE CACHE
        cache = allMatches;
        lastFetch = now;

        render(allMatches);

    } catch (err) {
        console.error("❌ ERROR:", err);
        container.innerHTML = "Error loading matches";
    }
}

function render(matches) {
    const container = document.getElementById("sportsList");
    container.innerHTML = "";

    matches.slice(0, 20).forEach(match => {

        const home = match.teams.home.name;
        const away = match.teams.away.name;

        const homeLogo = match.teams.home.logo;
        const awayLogo = match.teams.away.logo;

        const score = `${match.goals?.home ?? "-"} : ${match.goals?.away ?? "-"}`;
        const status = match.fixture?.status?.short || "";
        const leagueName = match.league?.name || "League";

        const isLive = ["1H","2H","HT","LIVE"].includes(status);

        const div = document.createElement("div");
        div.className = "match";

        div.innerHTML = `
            <div class="team-row">
                ${homeLogo ? `<img src="${homeLogo}" width="20">` : ""}
                ${home}
                <b>${score}</b>
                ${away}
                ${awayLogo ? `<img src="${awayLogo}" width="20">` : ""}
            </div>

            <div class="status">
                ${leagueName} • 
                <span style="color:${isLive ? '#ff4d4d' : '#00ffcc'}">
                    ${isLive ? "🔴 LIVE" : status}
                </span>
            </div>
        `;

        container.appendChild(div);
    });
}

// 🚀 RUN
loadLeague();
</script>
<script>

const API_KEY = "707146fc1eed4462a9609898231f68cd";

let page = 1;
let loading = false;
const CACHE_TIME = 30 * 60 * 1000; // 30 minutes

function isCacheValid() {
    const last = localStorage.getItem("lastUpdated");
    return last && (Date.now() - last < CACHE_TIME);
}
function loadFromCache() {
    const cached = localStorage.getItem("cachedNews");

    if (cached) {
        const articles = JSON.parse(cached);
        renderNews(articles);
    } else {
        console.warn("No cached news available");
    }
}
function renderNews(articles) {
    const grid = document.getElementById("newsGrid");
    grid.innerHTML = "";

    articles
        .filter(a => a.urlToImage)
        .forEach(article => {
            const card = createCard(article);
            grid.appendChild(card);
        });
}
// 🔥 INITIAL LOAD
async function loadNews() {
    if (isCacheValid()) {
        loadFromCache();
        return;
    }

    // else fetch fresh
    try {
        const data = await window.api.getNews(1);

        if (data && data.articles?.length > 0) {
            localStorage.setItem("cachedNews", JSON.stringify(data.articles));
            localStorage.setItem("lastUpdated", Date.now());
            renderNews(data.articles);
        } else {
            loadFromCache();
        }
    } catch {
        loadFromCache();
    }
}

// 🔁 LOAD MORE (INFINITE SCROLL)
const MAX_PAGES = 8;

async function loadMoreNews() {
    if (loading) return;
    if (page >= MAX_PAGES) return;

    loading = true;
    page++;

    try {
        const data = await window.api.getNews(page);

        if (!data || !data.articles) return;

        const grid = document.getElementById("newsGrid");

        data.articles.forEach(article => {
            const card = createCard(article);
            grid.appendChild(card);
        });

    } catch (err) {
        console.error("Load more error:", err);
    }

    loading = false;
}

// 🧩 CARD CREATOR (clean reusable)
function createCard(article) {
    const card = document.createElement("div");
    card.className = "news-card";

    const image = article.urlToImage || "https://via.placeholder.com/300x160?text=News";

    card.innerHTML = `
        <img src="${image}" onerror="this.src='https://via.placeholder.com/300x160?text=Image+Unavailable'">
        <div class="news-content">
            <div class="news-title">${article.title}</div>
            <div class="news-source">${article.source.name}</div>
        </div>
    `;

    card.onclick = () => window.location.href = article.url;

    return card;
}

// 📜 SCROLL DETECTION
window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        loadMoreNews();
    }
});

// 🚀 START
loadNews();

// 🔄 AUTO REFRESH
setInterval(loadNews, 1800000);

</script>

        );

            console.log("❌ No stations found → fallback");
            useUltimateFallback();
            return;
        }

        console.log("✅ Found stations:", finalList.length);

        tryPlay(finalList.slice(0, 15)); // limit to avoid overload

async function loadEnglishFallback() {
    const country = await detectCountry();

    const res = await fetch(
        `https://de1.api.radio-browser.info/json/stations/search?country=${country}&tag=news&limit=30`
    );

    const stations = await res.json();

    // ✅ filter English + playable
    const validStations = stations.filter(s =>
        s.url_resolved &&
        s.language && s.language.toLowerCase().includes("english") &&
        (s.url_resolved.includes("mp3") ||
         s.url_resolved.includes("aac") ||
         s.url_resolved.includes("stream"))
    );

    if (validStations.length === 0) {
        useUltimateFallback();
        return;
    }

    tryPlay(validStations);
}

// 🔁 Try list until one works
function tryPlay(stations) {
    let index = 0;

    function tryNext() {
        if (index >= stations.length) {
            // try fallback if premium failed
            useUltimateFallback();
            return;
        }

        const station = stations[index];
        audio.src = station.url || station.url_resolved;

        audio.play()
            .then(() => {
                let lang = languageSelect.value;

// ✅ if API gives language → use it
                if (station.language) {
                    lang = station.language.toLowerCase();
                }

                const langCode = langMap[lang] || "en-US";

                // ✅ support both types of URLs
                const streamURL = station.url || station.url_resolved;

                function cleanFileURL(url) {
                    if (url.startsWith("file:///")) {
                        return url.replace("file:///", "");
                    }
                    return url;
                }

                startSubtitles(cleanFileURL(streamURL), langCode);
                currentStation = station.name;
                updateUI();
                playBtn.innerText = "⏸";
                isPlaying = true;
                
            })
            .catch(() => {
                index++;
                tryNext();
            });
    }

    tryNext();
}

function useUltimateFallback() {
    audio.src = "http://stream.live.vc.bbcmedia.co.uk/bbc_world_service";
