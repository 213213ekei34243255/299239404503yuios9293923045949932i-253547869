<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    body {
        background: #08070c;
        color: #ece7fb;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* ── HEADER — VIOLET ZONE ── */
    .header {
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Space Grotesk', monospace;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #0e0a18, #150e24);
        border-bottom: 1px solid rgba(139,92,246,0.45);
        box-shadow: 0 2px 20px rgba(109,40,217,0.25);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #a78bfa;
        text-shadow: 0 0 12px rgba(139,92,246,0.8), 0 0 24px rgba(109,40,217,0.4);
    }

    .logo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #c4b5fd, #8b5cf6, #4c1d95);
        box-shadow: 0 0 16px rgba(139,92,246,0.8), 0 0 6px rgba(168,139,250,0.5);
        flex-shrink: 0;
        position: relative;
    }
    .logo::after {
        content: '◈';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        font-size: 14px;
        line-height: 1;
        color: #ede9ff;
    }

    .close-btn {
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.5);
        font-size: 15px;
        cursor: pointer;
        padding: 5px 9px;
        border-radius: 8px;
        transition: 0.2s;
        line-height: 1;
    }

    .close-btn:hover {
        background: rgba(139,92,246,0.18);
        color: #ffffff;
        box-shadow: 0 0 12px rgba(139,92,246,0.5);
        transform: scale(1.1);
    }

    /* ── CHAT AREA — VIOLET-BLACK ZONE ── */
    .chat {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #08070c;
        position: relative;
    }

    .chat::before {
        content: '';
        position: fixed;
        inset: 44px 0 60px 0;
        background: repeating-linear-gradient(
            0deg, transparent, transparent 2px,
            rgba(139,92,246,0.01) 2px, rgba(139,92,246,0.01) 4px
        );
        pointer-events: none;
        z-index: 0;
    }

    /* Fixed watermark */
    .chat::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 250px;
        height: 250px;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0);
        z-index: 9999;
    }

    .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
        width: 250px;
        opacity: 0.06;
        pointer-events: none;
        z-index: 0;
        filter: grayscale(1) brightness(0) invert(1);
    }

    .msg {
        max-width: 82%;
        padding: 10px 15px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
        z-index: 1;
        letter-spacing: 0.3px;
        word-break: break-word;
    }

    /* USER bubble — violet gradient */
    .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #4c1d95, #7c3aed);
        border: 1px solid rgba(139,92,246,0.5);
        box-shadow: 0 4px 16px rgba(109,40,217,0.4), inset 0 1px 0 rgba(216,201,255,0.2);
        color: #f5f2ff;
    }

    /* AI bubble — dark glass, violet-white glow */
    .ai {
        align-self: flex-start;
        background: rgba(18,14,28,0.9);
        border: 1px solid rgba(168,139,250,0.3);
        box-shadow: 0 4px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(216,201,255,0.1);
        color: #e4dbff;
        backdrop-filter: blur(8px);
    }

    /* ── INPUT AREA — VIOLET ZONE ── */
    .input-area {
        padding: 12px 14px;
        border-top: 1px solid rgba(139,92,246,0.25);
        display: flex;
        gap: 10px;
        background: #0a0810;
        box-shadow: 0 -2px 20px rgba(109,40,217,0.12);
    }

    input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 22px;
        border: 1px solid rgba(139,92,246,0.35);
        background: rgba(14,10,22,0.9);
        color: #e4dbff;
        outline: none;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        letter-spacing: 0.3px;
        transition: 0.3s;
        box-shadow: inset 0 0 12px rgba(109,40,217,0.08);
    }

    input::placeholder { color: rgba(168,139,250,0.45); }

    input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 2px rgba(139,92,246,0.25), 0 0 22px rgba(139,92,246,0.3), inset 0 0 12px rgba(109,40,217,0.1);
    }

    /* SEND BUTTON — violet gradient */
    button.send-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 22px;
        background: linear-gradient(135deg, #6d28d9, #8b5cf6);
        color: #f5f2ff;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;
        transition: 0.2s;
        box-shadow: 0 4px 0 rgba(76,29,149,0.6), 0 6px 18px rgba(109,40,217,0.4), inset 0 1px 0 rgba(216,201,255,0.25);
    }

    button.send-btn:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
        box-shadow: 0 6px 0 rgba(76,29,149,0.6), 0 10px 26px rgba(139,92,246,0.55), inset 0 1px 0 rgba(216,201,255,0.3);
        color: #ffffff;
        text-shadow: 0 0 10px #a78bfa;
    }

    button.send-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(76,29,149,0.5), 0 3px 8px rgba(109,40,217,0.3);
    }

    .typing {
        font-size: 13px;
        opacity: 0.65;
        font-style: italic;
        color: rgba(168,139,250,0.7);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0810; }
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8b5cf6, #4c1d95);
        border-radius: 10px;
        box-shadow: 0 0 6px rgba(109,40,217,0.55);
    }
    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a78bfa, #6d28d9);
        box-shadow: 0 0 10px rgba(139,92,246,0.7);
    }

    .msg {
        position: relative;
        z-index: 1;
    }

    /* ── CHAT / AGENT SWITCH ── */
    .mode-switch {
        display: flex; align-items: center; gap: 6px; padding: 8px 14px 0; background: #0a0810;
        border-top: 1px solid rgba(139,92,246,0.25); font-size: 11.5px; color: #a78bfa;
    }
    .mode-switch button {
        font: 600 12px 'Inter', sans-serif; padding: 5px 14px; border-radius: 16px; cursor: pointer;
        border: 1px solid rgba(139,92,246,0.4); background: transparent; color: #c9bfe8; transition: 0.15s;
    }
    .mode-switch button:hover { background: rgba(139,92,246,0.16); }
    .mode-switch button[aria-checked="true"] { background: linear-gradient(135deg, #6d28d9, #8b5cf6); border-color: #8b5cf6; color: #fff; box-shadow: 0 0 12px rgba(139,92,246,0.4); }
    .mode-switch button:focus-visible { outline: 2px solid #A855F7; outline-offset: 2px; }
    .mode-switch .mode-hint { margin-left: 4px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .mode-switch + .input-area { border-top: none; }

    /* ── NOAH CONTROLS ── */
    .noah-bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        padding: 8px 14px; background: #0c0915; border-bottom: 1px solid rgba(139,92,246,0.25);
        font-size: 12px; color: #c9bfe8;
    }
    .noah-bar select, .noah-bar button {
        font: 600 12px 'Inter', sans-serif; border-radius: 8px; border: 1px solid rgba(139,92,246,0.45);
        background: #150e24; color: #ece7fb; padding: 5px 9px; cursor: pointer;
    }
    .noah-bar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .noah-bar input[type=checkbox] { accent-color: #7C3AED; width: 14px; height: 14px; flex: none; padding: 0; }
    .noah-bar .stop { background: #EF4444; border-color: #EF4444; color: #fff; display: none; }
    .noah-bar .resume { background: #7C3AED; border-color: #7C3AED; color: #fff; display: none; }
    .noah-bar.running .stop, .noah-bar.paused .resume, .noah-bar.paused .stop { display: inline-block; }
    .noah-bar button:focus-visible, .noah-bar select:focus-visible { outline: 2px solid #A855F7; outline-offset: 2px; }
    .noah-status { flex-basis: 100%; font-size: 11.5px; color: #a78bfa; min-height: 15px; }
    .noah-bar[data-state="paused"] .noah-status, .noah-bar[data-state="waiting_for_user"] .noah-status { color: #fbbf24; }
    .noah-bar[data-state="error"] .noah-status { color: #f87171; }
    .noah-bar[data-state="completed"] .noah-status { color: #34d399; }
    .dots i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: #a78bfa; opacity: .35; animation: dot 1.1s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes dot { 0%, 80%, 100% { opacity: .35; } 40% { opacity: 1; } }
    .msg.notice { font-size: 12px; color: #fbbf24; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3); }
</style>
</head>

<body>

<div class="header">
    <div class="header-left">
        <div class="logo"></div>
        ASSISTANT
    </div>
    <button class="close-btn" onclick="closePanel()">✕</button>
</div>

<div class="noah-bar" id="noahBar" role="toolbar" aria-label="Noah controls">
    <label title="Autonomous: confirm only consequential actions. Supervised: confirm more. Strict: confirm every change.">
        Mode
        <select id="noahMode" aria-label="Confirmation mode">
            <option value="autonomous">Autonomous</option>
            <option value="supervised">Supervised</option>
            <option value="strict">Strict</option>
        </select>
    </label>
    <label title="Work only in tabs Noah opens itself, in a session without your cookies."><input type="checkbox" id="noahSandbox"> Sandbox</label>
    <label title="Show Noah's purple cursor, click ripples and target highlights on the page while it works. The status pill and STOP button always stay visible."><input type="checkbox" id="noahCursor" checked> Purple cursor</label>
    <button id="noahResume" class="resume" type="button">Continue</button>
    <button id="noahStop" class="stop" type="button" title="Stops Noah immediately (also: Esc)">Stop Noah</button>
    <div class="noah-status" id="noahStatus" aria-live="polite">Ready</div>
</div>

<div class="chat" id="chat">

    

</div>

<div class="mode-switch" id="modeSwitch" role="radiogroup" aria-label="How Noah handles your message">
    <button type="button" role="radio" data-mode="auto" aria-checked="true" title="Noah decides: it chats with you for questions and conversation, and works in the browser when you ask it to do something">Auto</button>
    <button type="button" role="radio" data-mode="chat" aria-checked="false" title="Just talk: Noah answers you and never touches the browser">Chat</button>
    <button type="button" role="radio" data-mode="agent" aria-checked="false" title="Noah does it in the browser: every message you send is treated as a task">Agent</button>
    <span class="mode-hint" id="modeHint"></span>
</div>

<div class="input-area">
    <input id="input" placeholder="Type your message..." />
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerHTML = escapeHTML(text);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// A short-lived "the assistant is answering" indicator for a chat reply. It never outlives its reply: any status change,
// answer or error removes it, and if nothing arrives it removes itself (bounded) instead of showing "thinking..." forever.
let typingTimer = null;
function showTyping() {
    removeTyping();
    const div = document.createElement("div");
    div.className = "msg ai typing";
    div.id = "typing";
    div.innerHTML = '<span class="dots" aria-label="Working"><i></i><i></i><i></i></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    typingTimer = setTimeout(() => {
        if (!document.getElementById("typing")) return;
        removeTyping();
        addMessage("I did not get an answer this time. Please try again.", "ai");
    }, 45000);
}

function removeTyping() {
    clearTimeout(typingTimer);
    typingTimer = null;
    const t = document.getElementById("typing");
    if (t) t.remove();
}

let sessionId = localStorage.getItem("session_id");
if (!sessionId) {
    sessionId = "electron_" + Math.random().toString(36).substring(2);
    localStorage.setItem("session_id", sessionId);
}

// Auto: Noah decides between talking and acting. Chat: only ever talks. Agent: every message is a browser task.
const MODES = {
    auto:  { hint: "Noah decides",   placeholder: "Type your message..." },
    chat:  { hint: "Talk only",      placeholder: "Chat with Noah..." },
    agent: { hint: "Browser tasks",  placeholder: "Tell Noah what to do in the browser..." },
};
let chatMode = "auto";
try {
    const saved = localStorage.getItem("noah_chat_mode");
    if (Object.prototype.hasOwnProperty.call(MODES, saved)) chatMode = saved;
} catch (_) { /* storage unavailable: stay on auto */ }

function setChatMode(mode) {
    if (!Object.prototype.hasOwnProperty.call(MODES, mode)) return;
    chatMode = mode;
    try { localStorage.setItem("noah_chat_mode", mode); } catch (_) { /* not persisted, still applied */ }
    document.querySelectorAll("#modeSwitch button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
    document.getElementById("modeHint").textContent = MODES[mode].hint;
    input.placeholder = MODES[mode].placeholder;
}
document.querySelectorAll("#modeSwitch button").forEach((b) => b.addEventListener("click", () => { setChatMode(b.dataset.mode); input.focus(); }));
setChatMode(chatMode);

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    showTyping();

    window.parent.postMessage({ type: "rexy:submit-goal", goal: text, mode: chatMode }, "*");
}

// ---------------------------------------------------------------------------
// Noah (computer-use agent): controls + event stream. The shell relays these via postMessage;
// only the parent window can reach the main process, this iframe never can.
// ---------------------------------------------------------------------------
const noahBar = document.getElementById("noahBar");
const noahStatus = document.getElementById("noahStatus");
const cmd = (c, extra) => window.parent.postMessage(Object.assign({ type: "noah:cmd", cmd: c }, extra || {}), "*");
document.getElementById("noahStop").addEventListener("click", () => cmd("stop"));
document.getElementById("noahResume").addEventListener("click", () => cmd("resume"));
document.getElementById("noahMode").addEventListener("change", (e) => cmd("config", { patch: { policy: { mode: e.target.value } } }));
document.getElementById("noahSandbox").addEventListener("change", (e) => cmd("config", { patch: { sessionMode: e.target.checked ? "isolated" : "user" } }));
document.getElementById("noahCursor").addEventListener("change", (e) => cmd("config", { patch: { cursor: { mode: e.target.checked ? "decoupled" : "off" } } }));
cmd("get-config");
cmd("get-state"); // a re-opened panel starts from the session's real state, not from a guess

function noahMsg(text, cls) {
    removeTyping();
    const div = document.createElement("div");
    div.className = "msg " + (cls || "ai");
    div.textContent = text; // textContent: page-derived strings can never inject markup here
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

// ONE status line, driven by the agent session: Ready / Working… / Paused / Waiting for you / Done / Something went wrong.
// The panel never shows the plan, per-step chatter, model switches or internal phases, only where things stand and the outcome.
let doneTimer = null;
function renderSession(s) {
    removeTyping();
    const state = s.state || "idle";
    const live = state === "planning" || state === "executing" || state === "paused" || state === "waiting_for_user";
    noahBar.classList.toggle("running", live);
    noahBar.classList.toggle("paused", state === "paused" || state === "waiting_for_user");
    noahBar.dataset.state = state;
    let text = s.label || "Ready";
    if (state === "planning" || state === "executing") text = s.text || "Working…";
    else if (state === "error" && s.text) text = "Something went wrong · " + s.text;
    noahStatus.textContent = text;
    clearTimeout(doneTimer);
    if (state === "completed") doneTimer = setTimeout(() => { if (noahBar.dataset.state === "completed") renderSession({ state: "idle", label: "Ready" }); }, 3500);
}

function onNoahEvent(evt) {
    switch (evt.event) {
        case "session_state": renderSession(evt); break;
        case "ask_user": noahMsg("⏸ " + (evt.question || "Noah needs you."), "ai"); break;
        case "confirm_request": noahMsg("🟣 Waiting for your OK on the page: " + (evt.summary || ""), "notice"); break;
        case "safety":
            if (evt.level === "taint") noahMsg("⚠ Instruction-like text was found on this page. Noah treats it as untrusted and will ask before risky actions.", "notice");
            break;
        case "task_finished":
            if (evt.superseded || evt.status === "cancelled") break; // replaced by a newer instruction / stopped: the status line already says so
            if (evt.status === "completed") noahMsg("✅ " + (evt.result || "Done"), "ai");
            else noahMsg("⚠ " + (evt.error || "The task did not finish."), "ai");
            break;
        default: break; // plan / step / agent_status / model_failover / pause+resume: deliberately not shown
    }
}

function applyNoahConfig(cfg) {
    if (!cfg) return;
    if (cfg.policy) document.getElementById("noahMode").value = cfg.policy.mode || "autonomous";
    document.getElementById("noahSandbox").checked = cfg.sessionMode === "isolated";
    document.getElementById("noahCursor").checked = !(cfg.cursor && cfg.cursor.mode === "off");
}

window.addEventListener("message", (event) => {
    const d = event.data || {};
    if (d.type === "noah:event") return onNoahEvent(d.payload);
    if (d.type === "noah:config") return applyNoahConfig(d.payload);
});

// Chat replies and errors come from the runtime channel. Agent runs are reported through noah:event (above) and their
// runtime relay is tagged `agent: true`, so nothing is ever shown twice.
window.addEventListener("message", (event) => {
    const { type, payload } = event.data || {};
    if (!/^rexy:goal-/.test(type || "")) return;
    if (type === "rexy:goal-submitted") {
        // an agent task shows its progress in the status line: no waiting bubble. A refusal is said once, plainly.
        if (payload && payload.success === false) { removeTyping(); addMessage("⚠️ " + (payload.error || "I could not start that."), "ai"); }
        else if (payload && payload.kind === "agent") removeTyping();
        return;
    }
    if (payload && payload.agent) return;

    if (type === "rexy:goal-step") {
        removeTyping();
        addMessage(payload?.result?.message || payload?.plan?.action || "step completed", "ai");
    }
    if (type === "rexy:goal-completed") {
        removeTyping();
        addMessage(payload?.reason || "Done", "ai");
    }
    if (type === "rexy:goal-error") {
        removeTyping();
        addMessage("⚠️ " + (payload?.error || "Something went wrong"), "ai");
    }
    if (type === "rexy:goal-blocked") {
        removeTyping();
        addMessage("🚫 Blocked by permissions", "ai");
    }
    if (type === "rexy:goal-paused") {
        removeTyping();
        addMessage("⏸ " + (payload?.result?.message || "Waiting for your input"), "ai");
    }
});

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

function closePanel() {
    const panel = window.parent.document.getElementById("aiPanel");
    if (panel) panel.classList.add("ai-hidden");
}
</script>
</body>
</html>
