<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    body {
        background: #08070c;
        color: #ece7fb;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* ── HEADER — VIOLET ZONE ── */
    .header {
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Space Grotesk', monospace;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #0e0a18, #150e24);
        border-bottom: 1px solid rgba(139,92,246,0.45);
        box-shadow: 0 2px 20px rgba(109,40,217,0.25);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #a78bfa;
        text-shadow: 0 0 12px rgba(139,92,246,0.8), 0 0 24px rgba(109,40,217,0.4);
    }

    .logo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #c4b5fd, #8b5cf6, #4c1d95);
        box-shadow: 0 0 16px rgba(139,92,246,0.8), 0 0 6px rgba(168,139,250,0.5);
        flex-shrink: 0;
        position: relative;
    }
    .logo::after {
        content: '◈';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        font-size: 14px;
        line-height: 1;
        color: #ede9ff;
    }

    .close-btn {
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.5);
        font-size: 15px;
        cursor: pointer;
        padding: 5px 9px;
        border-radius: 8px;
        transition: 0.2s;
        line-height: 1;
    }

    .close-btn:hover {
        background: rgba(139,92,246,0.18);
        color: #ffffff;
        box-shadow: 0 0 12px rgba(139,92,246,0.5);
        transform: scale(1.1);
    }

    /* ── CHAT AREA — VIOLET-BLACK ZONE ── */
    .chat {
        flex: 1;
        min-height: 0;
        padding: 14px 12px 16px;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: #08070c;
        position: relative;
    }
    .chat.drop { outline: 2px dashed #8b5cf6; outline-offset: -8px; background: #0d0a16; }

    .chat::before {
        content: '';
        position: fixed;
        inset: 44px 0 60px 0;
        background: repeating-linear-gradient(
            0deg, transparent, transparent 2px,
            rgba(139,92,246,0.01) 2px, rgba(139,92,246,0.01) 4px
        );
        pointer-events: none;
        z-index: 0;
    }

    /* Fixed watermark */
    .chat::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 250px;
        height: 250px;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0);
        z-index: 9999;
    }

    .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
        width: 250px;
        opacity: 0.06;
        pointer-events: none;
        z-index: 0;
        filter: grayscale(1) brightness(0) invert(1);
    }

    .msg {
        max-width: 82%;
        padding: 10px 15px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
        z-index: 1;
        letter-spacing: 0.3px;
        word-break: break-word;
    }

    /* USER bubble — violet gradient */
    .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #4c1d95, #7c3aed);
        border: 1px solid rgba(139,92,246,0.5);
        box-shadow: 0 4px 16px rgba(109,40,217,0.4), inset 0 1px 0 rgba(216,201,255,0.2);
        color: #f5f2ff;
    }

    /* AI message — no bubble: transparent on the chat background, the full width of the panel, so long answers,
       tables and code are not squeezed into a small box. (User messages keep their violet bubble above.) */
    .ai {
        align-self: stretch;
        max-width: 100%;
        background: transparent;
        border: none;
        box-shadow: none;
        backdrop-filter: none;
        border-radius: 0;
        padding: 2px 4px;
        letter-spacing: 0.1px;
        overflow-wrap: anywhere;
        color: #e4dbff;
    }
    .user { white-space: pre-wrap; }
    .user .att { display: block; margin-top: 6px; font-size: 11.5px; opacity: .85; white-space: normal; }
    .att-note { align-self: stretch; font-size: 11.5px; color: #a78bfa; opacity: .85; padding: 0 4px; }

    /* ── INPUT AREA — VIOLET ZONE ── */
    .input-area {
        padding: 12px 14px;
        border-top: 1px solid rgba(139,92,246,0.25);
        display: flex;
        gap: 10px;
        background: #0a0810;
        box-shadow: 0 -2px 20px rgba(109,40,217,0.12);
    }

    input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 22px;
        border: 1px solid rgba(139,92,246,0.35);
        background: rgba(14,10,22,0.9);
        color: #e4dbff;
        outline: none;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        letter-spacing: 0.3px;
        transition: 0.3s;
        box-shadow: inset 0 0 12px rgba(109,40,217,0.08);
    }

    input::placeholder { color: rgba(168,139,250,0.45); }

    input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 2px rgba(139,92,246,0.25), 0 0 22px rgba(139,92,246,0.3), inset 0 0 12px rgba(109,40,217,0.1);
    }

    /* SEND BUTTON — violet gradient */
    button.send-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 22px;
        background: linear-gradient(135deg, #6d28d9, #8b5cf6);
        color: #f5f2ff;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;
        transition: 0.2s;
        box-shadow: 0 4px 0 rgba(76,29,149,0.6), 0 6px 18px rgba(109,40,217,0.4), inset 0 1px 0 rgba(216,201,255,0.25);
    }

    button.send-btn:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
        box-shadow: 0 6px 0 rgba(76,29,149,0.6), 0 10px 26px rgba(139,92,246,0.55), inset 0 1px 0 rgba(216,201,255,0.3);
        color: #ffffff;
        text-shadow: 0 0 10px #a78bfa;
    }

    button.send-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(76,29,149,0.5), 0 3px 8px rgba(109,40,217,0.3);
    }

    .typing {
        font-size: 13px;
        opacity: 0.65;
        font-style: italic;
        color: rgba(168,139,250,0.7);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0810; }
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8b5cf6, #4c1d95);
        border-radius: 10px;
        box-shadow: 0 0 6px rgba(109,40,217,0.55);
    }
    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a78bfa, #6d28d9);
        box-shadow: 0 0 10px rgba(139,92,246,0.7);
    }

    .msg {
        position: relative;
        z-index: 1;
    }

    /* ── CHAT / AGENT SWITCH ── */
    .mode-switch {
        display: flex; align-items: center; gap: 6px; padding: 8px 14px 0; background: #0a0810;
        border-top: 1px solid rgba(139,92,246,0.25); font-size: 11.5px; color: #a78bfa;
    }
    .mode-switch button {
        font: 600 12px 'Inter', sans-serif; padding: 5px 14px; border-radius: 16px; cursor: pointer;
        border: 1px solid rgba(139,92,246,0.4); background: transparent; color: #c9bfe8; transition: 0.15s;
    }
    .mode-switch button:hover { background: rgba(139,92,246,0.16); }
    .mode-switch button[aria-checked="true"] { background: linear-gradient(135deg, #6d28d9, #8b5cf6); border-color: #8b5cf6; color: #fff; box-shadow: 0 0 12px rgba(139,92,246,0.4); }
    .mode-switch button:focus-visible { outline: 2px solid #A855F7; outline-offset: 2px; }
    .mode-switch .mode-hint { margin-left: 4px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .mode-switch + .input-area { border-top: none; }

    /* ── NOAH CONTROLS ── */
    .noah-bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        padding: 8px 14px; background: #0c0915; border-bottom: 1px solid rgba(139,92,246,0.25);
        font-size: 12px; color: #c9bfe8;
    }
    .noah-bar select, .noah-bar button {
        font: 600 12px 'Inter', sans-serif; border-radius: 8px; border: 1px solid rgba(139,92,246,0.45);
        background: #150e24; color: #ece7fb; padding: 5px 9px; cursor: pointer;
    }
    .noah-bar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .noah-bar input[type=checkbox] { accent-color: #7C3AED; width: 14px; height: 14px; flex: none; padding: 0; }
    .noah-bar .stop { background: #EF4444; border-color: #EF4444; color: #fff; display: none; }
    .noah-bar .resume { background: #7C3AED; border-color: #7C3AED; color: #fff; display: none; }
    .noah-bar.running .stop, .noah-bar.paused .resume, .noah-bar.paused .stop { display: inline-block; }
    .noah-bar button:focus-visible, .noah-bar select:focus-visible { outline: 2px solid #A855F7; outline-offset: 2px; }
    .noah-status { flex-basis: 100%; font-size: 11.5px; color: #a78bfa; min-height: 15px; }
    .noah-bar[data-state="paused"] .noah-status, .noah-bar[data-state="waiting_for_user"] .noah-status { color: #fbbf24; }
    .noah-bar[data-state="error"] .noah-status { color: #f87171; }
    .noah-bar[data-state="completed"] .noah-status { color: #34d399; }
    .dots i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: #a78bfa; opacity: .35; animation: dot 1.1s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes dot { 0%, 80%, 100% { opacity: .35; } 40% { opacity: 1; } }
    .msg.notice { font-size: 12px; color: #fbbf24; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3); }

    /* ── RICH REPLIES (Markdown) ── the global reset above zeroes every margin/padding, so each element is styled here */
    .md { font-size: 14px; line-height: 1.6; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 10px; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-family: 'Space Grotesk', 'Inter', sans-serif; color: #f1ecff; line-height: 1.25; margin: 16px 0 6px; letter-spacing: 0.2px; }
    .md h1 { font-size: 20px; padding-bottom: 5px; border-bottom: 1px solid rgba(139,92,246,.3); }
    .md h2 { font-size: 17px; }
    .md h3 { font-size: 15px; }
    .md h4, .md h5, .md h6 { font-size: 14px; color: #d9ceff; }
    .md strong, .md b { color: #f7f4ff; font-weight: 650; }
    .md em, .md i { color: #ddd2ff; }
    .md del, .md s { opacity: .7; }
    .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
    .md ul { list-style: disc; }
    .md ul ul { list-style: circle; }
    .md ul ul ul { list-style: square; }
    .md li { margin: 3px 0; padding-left: 2px; }
    .md li > ul, .md li > ol { margin: 4px 0 2px; }
    .md li::marker { color: #a78bfa; }
    .md blockquote { margin: 0 0 10px; padding: 8px 12px; border-left: 3px solid #8b5cf6; background: rgba(139,92,246,.09); border-radius: 0 8px 8px 0; color: #d9ceff; }
    .md blockquote > :last-child { margin-bottom: 0; }
    .md hr { border: none; border-top: 1px solid rgba(139,92,246,.35); margin: 14px 0; }
    .md a { color: #a78bfa; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .md a:hover { color: #c4b5fd; }
    .md :not(pre) > code { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; font-size: 12.5px; background: rgba(139,92,246,.18); color: #eadfff; padding: 1px 6px; border-radius: 5px; }
    .md kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; padding: 1px 6px; border: 1px solid rgba(139,92,246,.5); border-bottom-width: 2px; border-radius: 5px; background: #150e24; }
    .md .table-wrap { overflow-x: auto; margin: 0 0 12px; border: 1px solid rgba(139,92,246,.3); border-radius: 8px; }
    .md table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .md th, .md td { padding: 6px 10px; text-align: left; border-bottom: 1px solid rgba(139,92,246,.18); vertical-align: top; }
    .md th[align="right"], .md td[align="right"] { text-align: right; }
    .md th[align="center"], .md td[align="center"] { text-align: center; }
    .md th { background: rgba(139,92,246,.16); color: #f1ecff; font-weight: 600; white-space: nowrap; }
    .md tr:last-child td { border-bottom: none; }
    .md tbody tr:nth-child(even) td { background: rgba(139,92,246,.05); }

    /* ── CODE BLOCKS ── */
    .codeblock { margin: 0 0 12px; border: 1px solid rgba(139,92,246,.38); border-radius: 10px; overflow: hidden; background: #0d0a16; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
    .codeblock-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 6px 5px 12px; background: #181227; border-bottom: 1px solid rgba(139,92,246,.28); }
    .codeblock-lang { font: 600 11.5px 'Inter', sans-serif; letter-spacing: .6px; color: #b9a9ee; text-transform: none; }
    .codeblock-copy { font: 600 11.5px 'Inter', sans-serif; padding: 3px 11px; border-radius: 7px; border: 1px solid rgba(139,92,246,.5); background: transparent; color: #ddd2ff; cursor: pointer; transition: .15s; }
    .codeblock-copy:hover { background: rgba(139,92,246,.25); color: #fff; }
    .codeblock-copy.copied { border-color: #34d399; color: #34d399; background: rgba(52,211,153,.1); }
    .codeblock-copy:focus-visible { outline: 2px solid #A855F7; outline-offset: 2px; }
    .codeblock pre { margin: 0; padding: 12px 14px; overflow: auto; max-height: min(65vh, 520px); }
    .codeblock pre::-webkit-scrollbar { height: 8px; width: 8px; }
    .codeblock pre code.hljs { display: block; font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre; tab-size: 2; background: transparent; color: #e4dbff; padding: 0; letter-spacing: 0; }
    .hljs-comment, .hljs-quote { color: #7d7399; font-style: italic; }
    .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-name { color: #c792ea; }
    .hljs-string, .hljs-regexp, .hljs-addition, .hljs-selector-attr, .hljs-selector-pseudo { color: #a6e3a1; }
    .hljs-number, .hljs-symbol, .hljs-bullet { color: #f9b572; }
    .hljs-title, .hljs-title.function_, .hljs-section { color: #7dcfff; }
    .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property, .hljs-params { color: #f0a8d0; }
    .hljs-built_in, .hljs-type, .hljs-title.class_, .hljs-class .hljs-title, .hljs-selector-class, .hljs-selector-id { color: #ffd58a; }
    .hljs-meta, .hljs-link { color: #89b4fa; }
    .hljs-deletion { color: #f38ba8; }
    .hljs-emphasis { font-style: italic; }
    .hljs-strong { font-weight: 700; }

    /* ── ATTACHMENTS ── */
    .attach-tray { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 14px 2px; background: #0a0810; border-top: 1px solid rgba(139,92,246,.25); }
    .attach-tray.has { display: flex; }
    .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 5px 4px 9px; border-radius: 14px; background: rgba(139,92,246,.14); border: 1px solid rgba(139,92,246,.42); font-size: 12px; color: #e4dbff; }
    .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
    .chip .sub { opacity: .68; font-size: 11px; white-space: nowrap; }
    .chip .x { border: none; background: transparent; color: #b9a9ee; cursor: pointer; padding: 0 5px; font-size: 15px; line-height: 1; border-radius: 50%; }
    .chip .x:hover { color: #fff; background: rgba(139,92,246,.35); }
    .chip.loading .sub::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 2px solid rgba(167,139,250,.35); border-top-color: #a78bfa; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
    .chip.warn { border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.08); }
    .chip.error { border-color: rgba(248,113,113,.65); background: rgba(248,113,113,.1); }
    .chip.error .sub { color: #fca5a5; opacity: 1; white-space: normal; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .attach-btn { width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(139,92,246,.4); background: rgba(14,10,22,.9); color: #b9a9ee; cursor: pointer; transition: .2s; }
    .attach-btn:hover { background: rgba(139,92,246,.22); color: #fff; box-shadow: 0 0 14px rgba(139,92,246,.4); }
    .attach-btn:focus-visible { outline: 2px solid #A855F7; outline-offset: 2px; }
    .attach-btn svg { width: 19px; height: 19px; }
    .input-area { align-items: center; }

    /* wake word state, next to its switch in the Noah bar */
    .wake-state { font-size: 11px; color: #a78bfa; }
    .wake-state[data-phase="error"] { color: #f87171; }
    .wake-state[data-phase="capturing"] { color: #34d399; }
</style>
</head>

<body>

<div class="header">
    <div class="header-left">
        <div class="logo"></div>
        ASSISTANT
    </div>
    <button class="close-btn" onclick="closePanel()">✕</button>
</div>

<div class="noah-bar" id="noahBar" role="toolbar" aria-label="Noah controls">
    <label title="Autonomous: confirm only consequential actions. Supervised: confirm more. Strict: confirm every change.">
        Mode
        <select id="noahMode" aria-label="Confirmation mode">
            <option value="autonomous">Autonomous</option>
            <option value="supervised">Supervised</option>
            <option value="strict">Strict</option>
        </select>
    </label>
    <label title="Work only in tabs Noah opens itself, in a session without your cookies."><input type="checkbox" id="noahSandbox"> Sandbox</label>
    <label title="Show Noah's purple cursor, click ripples and target highlights on the page while it works. The status pill and STOP button always stay visible."><input type="checkbox" id="noahCursor" checked> Purple cursor</label>
    <label title="Say “Noah” to start talking, hands-free. While this is on, Jonah keeps the microphone open and listens ONLY for that word on your device: nothing is recorded, saved or sent anywhere until you say it. Off by default. Typed chats are never spoken aloud."><input type="checkbox" id="noahWake"> Wake word “Noah”</label>
    <span class="wake-state" id="wakeState" data-phase="off" aria-live="polite"></span>
    <button id="noahResume" class="resume" type="button">Continue</button>
    <button id="noahStop" class="stop" type="button" title="Stops Noah immediately (also: Esc)">Stop Noah</button>
    <div class="noah-status" id="noahStatus" aria-live="polite">Ready</div>
</div>

<div class="chat" id="chat">

    

</div>

<div class="attach-tray" id="attachTray" aria-label="Attached files"></div>

<div class="mode-switch" id="modeSwitch" role="radiogroup" aria-label="How Noah handles your message">
    <button type="button" role="radio" data-mode="auto" aria-checked="true" title="Noah decides: it chats with you for questions and conversation, and works in the browser when you ask it to do something">Auto</button>
    <button type="button" role="radio" data-mode="chat" aria-checked="false" title="Just talk: Noah answers you and never touches the browser">Chat</button>
    <button type="button" role="radio" data-mode="agent" aria-checked="false" title="Noah does it in the browser: every message you send is treated as a task">Agent</button>
    <span class="mode-hint" id="modeHint"></span>
</div>

<div class="input-area">
    <button class="attach-btn" id="attachBtn" type="button" title="Attach files: PDF, Word, Excel, PowerPoint, images (text is read with OCR), text and more" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
    </button>
    <input id="input" placeholder="Type your message..." />
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>
<input type="file" id="fileInput" multiple hidden accept=".pdf,.doc,.docx,.docm,.xls,.xlsx,.xlsm,.csv,.tsv,.ppt,.pptx,.odt,.ods,.odp,.rtf,.txt,.md,.json,.xml,.html,.htm,.log,.yml,.yaml,.py,.js,.ts,.java,.c,.cpp,.cs,.go,.rs,.rb,.php,.sh,.sql,image/png,image/jpeg,image/webp,image/bmp,image/gif">

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/highlight-extra.min.js"></script>
<script src="chat-render.js"></script>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

// Assistant replies are rendered as rich, sanitized Markdown (see chat-render.js). If the render libraries failed to load for any reason,
// fall back to plain escaped text: a reply must never disappear because of a styling problem.
let richRenderer = null;
try {
    richRenderer = window.JonahChatRender.createRenderer({
        marked: window.marked,
        DOMPurify: window.DOMPurify,
        hljs: window.hljs,
        onOpenLink: (url) => window.parent.postMessage({ type: "noah:open-url", url }, "*"),
    });
} catch (err) {
    console.warn("[panel] rich rendering unavailable, using plain text:", err && err.message);
}

function fillMessage(div, text, type) {
    if (type === "ai" && richRenderer) {
        try { div.appendChild(richRenderer.render(text)); return; } catch (err) { console.warn("[panel] render failed:", err && err.message); }
    }
    div.textContent = text; // user text and fallbacks: textContent, so nothing typed or received can inject markup
}

function addMessage(text, type, attachedNames) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    fillMessage(div, text, type);
    if (type === "user" && attachedNames && attachedNames.length) {
        const a = document.createElement("span");
        a.className = "att";
        a.textContent = "📎 " + attachedNames.join(", ");
        div.appendChild(a);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

// A short-lived "the assistant is answering" indicator for a chat reply. It never outlives its reply: any status change,
// answer or error removes it, and if nothing arrives it removes itself (bounded) instead of showing "thinking..." forever.
let typingTimer = null;
function showTyping() {
    removeTyping();
    const div = document.createElement("div");
    div.className = "msg ai typing";
    div.id = "typing";
    div.innerHTML = '<span class="dots" aria-label="Working"><i></i><i></i><i></i></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    typingTimer = setTimeout(() => {
        if (!document.getElementById("typing")) return;
        removeTyping();
        addMessage("I did not get an answer this time. Please try again.", "ai");
    }, 45000);
}

function removeTyping() {
    clearTimeout(typingTimer);
    typingTimer = null;
    const t = document.getElementById("typing");
    if (t) t.remove();
}

let sessionId = localStorage.getItem("session_id");
if (!sessionId) {
    sessionId = "electron_" + Math.random().toString(36).substring(2);
    localStorage.setItem("session_id", sessionId);
}

// Auto: Noah decides between talking and acting. Chat: only ever talks. Agent: every message is a browser task.
const MODES = {
    auto:  { hint: "Noah decides",   placeholder: "Type your message..." },
    chat:  { hint: "Talk only",      placeholder: "Chat with Noah..." },
    agent: { hint: "Browser tasks",  placeholder: "Tell Noah what to do in the browser..." },
};
let chatMode = "auto";
try {
    const saved = localStorage.getItem("noah_chat_mode");
    if (Object.prototype.hasOwnProperty.call(MODES, saved)) chatMode = saved;
} catch (_) { /* storage unavailable: stay on auto */ }

function setChatMode(mode) {
    if (!Object.prototype.hasOwnProperty.call(MODES, mode)) return;
    chatMode = mode;
    try { localStorage.setItem("noah_chat_mode", mode); } catch (_) { /* not persisted, still applied */ }
    document.querySelectorAll("#modeSwitch button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
    document.getElementById("modeHint").textContent = MODES[mode].hint;
    input.placeholder = MODES[mode].placeholder;
}
document.querySelectorAll("#modeSwitch button").forEach((b) => b.addEventListener("click", () => { setChatMode(b.dataset.mode); input.focus(); }));
setChatMode(chatMode);

// ---------------------------------------------------------------------------
// Attachments. A file is read in the MAIN process (text extraction, OCR): this panel only sends the bytes up through the shell and
// gets back an id + a one-line summary. The chips stay above the input for the whole conversation, so follow-up questions keep using
// the file until the user removes it.
// ---------------------------------------------------------------------------
const MAX_ATTACH_BYTES = 30 * 1024 * 1024;
const attachTray = document.getElementById("attachTray");
const fileInput = document.getElementById("fileInput");
const attachments = []; // { key, id, name, status: "loading" | "ready" | "warn" | "error", sub, tip }
const pendingAttach = new Map(); // reqId -> resolve
let attachSeq = 0;

function describeAttachment(r) {
    const bits = [];
    if (r.meta && r.meta.pages) bits.push(r.meta.pages + (r.meta.pages === 1 ? " page" : " pages"));
    if (r.meta && r.meta.slides) bits.push(r.meta.slides + (r.meta.slides === 1 ? " slide" : " slides"));
    if (r.meta && r.meta.sheets) bits.push(r.meta.sheets + (r.meta.sheets === 1 ? " sheet" : " sheets"));
    if (r.kind === "image") bits.push("text read by OCR");
    if (!bits.length) bits.push(r.chars.toLocaleString("en-US") + " characters");
    return bits.join(" · ");
}

function renderTray() {
    attachTray.textContent = "";
    attachTray.classList.toggle("has", attachments.length > 0);
    for (const a of attachments) {
        const chip = document.createElement("span");
        chip.className = "chip " + (a.status === "ready" ? "" : a.status);
        if (a.tip) chip.title = a.tip;
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = a.name;
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = a.sub || "";
        const x = document.createElement("button");
        x.type = "button";
        x.className = "x";
        x.textContent = "×";
        x.setAttribute("aria-label", "Remove " + a.name);
        x.addEventListener("click", () => removeAttachment(a.key));
        chip.append(name, sub, x);
        attachTray.appendChild(chip);
    }
}

function removeAttachment(key) {
    const i = attachments.findIndex((a) => a.key === key);
    if (i < 0) return;
    const [a] = attachments.splice(i, 1);
    if (a.id) window.parent.postMessage({ type: "noah:attach-remove", id: a.id }, "*");
    renderTray();
}

async function attachFile(file) {
    const key = "f" + ++attachSeq;
    const a = { key, id: null, name: file.name, status: "loading", sub: "reading…" };
    attachments.push(a);
    renderTray();
    if (file.size > MAX_ATTACH_BYTES) {
        Object.assign(a, { status: "error", sub: "too large (limit 30 MB)" });
        return renderTray();
    }
    if (attachments.length > 10) {
        attachments.splice(attachments.indexOf(a), 1);
        renderTray();
        return noahMsg("You can attach up to 10 files at once. Remove one first.", "notice");
    }
    let buf;
    try { buf = await file.arrayBuffer(); } catch (_) {
        Object.assign(a, { status: "error", sub: "could not be read" });
        return renderTray();
    }
    const result = await new Promise((resolve) => {
        const timer = setTimeout(() => { pendingAttach.delete(key); resolve({ ok: false, error: "took too long to read" }); }, 180000); // the first image also downloads OCR data
        pendingAttach.set(key, (r) => { clearTimeout(timer); resolve(r); });
        window.parent.postMessage({ type: "noah:attach-file", reqId: key, name: file.name, data: buf }, "*", [buf]);
    });
    if (!attachments.includes(a)) { // removed while it was being read
        if (result && result.ok && result.id) window.parent.postMessage({ type: "noah:attach-remove", id: result.id }, "*");
        return;
    }
    if (!result || !result.ok) {
        Object.assign(a, { status: "error", sub: (result && result.error) || "could not be read", tip: (result && result.error) || "" });
    } else {
        a.id = result.id;
        const warnings = (result.warnings || []).join("\n");
        if (result.empty) Object.assign(a, { status: "warn", sub: "no readable text", tip: warnings });
        else Object.assign(a, { status: "ready", sub: describeAttachment(result), tip: warnings });
    }
    renderTray();
}

function addFiles(list) {
    for (const f of Array.from(list || [])) attachFile(f);
}
document.getElementById("attachBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
// drag a file onto the chat, or paste an image/file into the box
let dragDepth = 0;
chat.addEventListener("dragenter", (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) { dragDepth++; chat.classList.add("drop"); e.preventDefault(); } });
chat.addEventListener("dragover", (e) => { if (chat.classList.contains("drop")) e.preventDefault(); });
chat.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; chat.classList.remove("drop"); } });
chat.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; chat.classList.remove("drop"); addFiles(e.dataTransfer && e.dataTransfer.files); });
input.addEventListener("paste", (e) => {
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (files.length) { e.preventDefault(); addFiles(files); }
});
// a fresh panel starts with no chips, so the main process must not still be holding files from an earlier one
window.parent.postMessage({ type: "noah:attach-clear" }, "*");

// what the model was actually shown of the attached files is mentioned once, after the reply, when it was only excerpts
let pendingAttachNote = null;

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    const loading = attachments.find((a) => a.status === "loading");
    if (loading) {
        noahMsg("Still reading “" + loading.name + "”. Send again in a moment.", "notice");
        return;
    }
    const usable = attachments.filter((a) => a.id && (a.status === "ready"));

    addMessage(text, "user", usable.map((a) => a.name));
    input.value = "";
    showTyping();

    window.parent.postMessage({ type: "rexy:submit-goal", goal: text, mode: chatMode, attachmentIds: usable.map((a) => a.id) }, "*");
}

// ---------------------------------------------------------------------------
// Noah (computer-use agent): controls + event stream. The shell relays these via postMessage;
// only the parent window can reach the main process, this iframe never can.
// ---------------------------------------------------------------------------
const noahBar = document.getElementById("noahBar");
const noahStatus = document.getElementById("noahStatus");
const cmd = (c, extra) => window.parent.postMessage(Object.assign({ type: "noah:cmd", cmd: c }, extra || {}), "*");
document.getElementById("noahStop").addEventListener("click", () => cmd("stop"));
document.getElementById("noahResume").addEventListener("click", () => cmd("resume"));
document.getElementById("noahMode").addEventListener("change", (e) => cmd("config", { patch: { policy: { mode: e.target.value } } }));
document.getElementById("noahSandbox").addEventListener("change", (e) => cmd("config", { patch: { sessionMode: e.target.checked ? "isolated" : "user" } }));
document.getElementById("noahCursor").addEventListener("change", (e) => cmd("config", { patch: { cursor: { mode: e.target.checked ? "decoupled" : "off" } } }));
cmd("get-config");
cmd("get-state"); // a re-opened panel starts from the session's real state, not from a guess

function noahMsg(text, cls) {
    removeTyping();
    const div = document.createElement("div");
    div.className = "msg " + (cls || "ai");
    fillMessage(div, text, cls || "ai"); // page-derived strings can never inject markup: Markdown output is sanitized, everything else is textContent
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

// ONE status line, driven by the agent session: Ready / Working… / Paused / Waiting for you / Done / Something went wrong.
// The panel never shows the plan, per-step chatter, model switches or internal phases, only where things stand and the outcome.
let doneTimer = null;
function renderSession(s) {
    removeTyping();
    const state = s.state || "idle";
    const live = state === "planning" || state === "executing" || state === "paused" || state === "waiting_for_user";
    noahBar.classList.toggle("running", live);
    noahBar.classList.toggle("paused", state === "paused" || state === "waiting_for_user");
    noahBar.dataset.state = state;
    let text = s.label || "Ready";
    if (state === "planning" || state === "executing") text = s.text || "Working…";
    else if (state === "error" && s.text) text = "Something went wrong · " + s.text;
    noahStatus.textContent = text;
    clearTimeout(doneTimer);
    if (state === "completed") doneTimer = setTimeout(() => { if (noahBar.dataset.state === "completed") renderSession({ state: "idle", label: "Ready" }); }, 3500);
}

function onNoahEvent(evt) {
    switch (evt.event) {
        case "session_state": renderSession(evt); break;
        case "ask_user": noahMsg("⏸ " + (evt.question || "Noah needs you."), "ai"); break;
        case "confirm_request": noahMsg("🟣 Waiting for your OK on the page: " + (evt.summary || ""), "notice"); break;
        case "safety":
            if (evt.level === "taint") noahMsg("⚠ Instruction-like text was found on this page. Noah treats it as untrusted and will ask before risky actions.", "notice");
            break;
        case "task_finished":
            if (evt.superseded || evt.status === "cancelled") break; // replaced by a newer instruction / stopped: the status line already says so
            if (evt.status === "completed") noahMsg("✅ " + (evt.result || "Done"), "ai");
            else noahMsg("⚠ " + (evt.error || "The task did not finish."), "ai");
            break;
        default: break; // plan / step / agent_status / model_failover / pause+resume: deliberately not shown
    }
}

function applyNoahConfig(cfg) {
    if (!cfg) return;
    if (cfg.policy) document.getElementById("noahMode").value = cfg.policy.mode || "autonomous";
    document.getElementById("noahSandbox").checked = cfg.sessionMode === "isolated";
    document.getElementById("noahCursor").checked = !(cfg.cursor && cfg.cursor.mode === "off");
}

window.addEventListener("message", (event) => {
    const d = event.data || {};
    if (d.type === "noah:event") return onNoahEvent(d.payload);
    if (d.type === "noah:config") return applyNoahConfig(d.payload);
    if (d.type === "noah:attach-result") {
        const resolve = pendingAttach.get(d.payload && d.payload.reqId);
        if (resolve) { pendingAttach.delete(d.payload.reqId); resolve(d.payload.result); }
        return;
    }
    if (d.type === "noah:wake-state") return applyWakeState(d.payload);
});

// ---------------------------------------------------------------------------
// Wake word ("Noah"). The switch only asks the shell (where the microphone and the voice orb live); the shell reports the real state
// back, so the checkbox can never claim the microphone is listening when it is not (permission denied, model not loaded, ...).
// ---------------------------------------------------------------------------
const wakeBox = document.getElementById("noahWake");
const wakeState = document.getElementById("wakeState");
const WAKE_TEXT = { off: "", loading: "loading the voice model…", listening: "👂 listening for “Noah”", capturing: "🎙 listening to you…", error: "" };
function applyWakeState(s) {
    if (!s) return;
    wakeBox.checked = !!s.enabled;
    const phase = s.enabled ? (s.phase || "listening") : (s.phase === "error" ? "error" : "off");
    wakeState.dataset.phase = phase;
    wakeState.textContent = phase === "error" ? "⚠ " + (s.error || "could not start") : (WAKE_TEXT[phase] || "") + (phase === "loading" && s.progress != null ? " " + s.progress + "%" : "");
    wakeState.title = phase === "error" ? (s.error || "") : "";
}
wakeBox.addEventListener("change", () => {
    wakeState.dataset.phase = wakeBox.checked ? "loading" : "off";
    wakeState.textContent = wakeBox.checked ? WAKE_TEXT.loading : "";
    window.parent.postMessage({ type: "noah:wake", enabled: wakeBox.checked }, "*");
});
window.parent.postMessage({ type: "noah:wake-get" }, "*");

// Typing tells the shell the user is at the keyboard, so keystrokes are never mistaken for speech and a typed conversation
// never wakes the voice orb.
let lastTypingPing = 0;
input.addEventListener("input", () => {
    const now = Date.now();
    if (now - lastTypingPing > 400) { lastTypingPing = now; window.parent.postMessage({ type: "noah:typing" }, "*"); }
});

// Chat replies and errors come from the runtime channel. Agent runs are reported through noah:event (above) and their
// runtime relay is tagged `agent: true`, so nothing is ever shown twice.
window.addEventListener("message", (event) => {
    const { type, payload } = event.data || {};
    if (!/^rexy:goal-/.test(type || "")) return;
    if (type === "rexy:goal-submitted") {
        // an agent task shows its progress in the status line: no waiting bubble. A refusal is said once, plainly.
        if (payload && payload.success === false) { removeTyping(); addMessage("⚠️ " + (payload.error || "I could not start that."), "ai"); }
        else if (payload && payload.kind === "agent") removeTyping();
        // The model only sees what fits: when a long file was cut down to the relevant parts, say so once, after the answer.
        const partial = payload && Array.isArray(payload.attachmentUse) ? payload.attachmentUse.filter((f) => !f.whole) : [];
        pendingAttachNote = partial.length
            ? "Answered from excerpts of " + partial.map((f) => f.name + " (" + f.shown + " of " + f.of + " sections)").join(", ") + ". Ask about a specific part for more detail."
            : null;
        return;
    }
    if (payload && payload.agent) return;

    if (type === "rexy:goal-step") {
        removeTyping();
        addMessage(payload?.result?.message || payload?.plan?.action || "step completed", "ai");
    }
    if (type === "rexy:goal-completed") {
        removeTyping();
        addMessage(payload?.reason || "Done", "ai");
        if (pendingAttachNote) {
            const n = document.createElement("div");
            n.className = "att-note";
            n.textContent = "📎 " + pendingAttachNote;
            chat.appendChild(n);
            chat.scrollTop = chat.scrollHeight;
            pendingAttachNote = null;
        }
    }
    if (type === "rexy:goal-error") {
        removeTyping();
        addMessage("⚠️ " + (payload?.error || "Something went wrong"), "ai");
    }
    if (type === "rexy:goal-blocked") {
        removeTyping();
        addMessage("🚫 Blocked by permissions", "ai");
    }
    if (type === "rexy:goal-paused") {
        removeTyping();
        addMessage("⏸ " + (payload?.result?.message || "Waiting for your input"), "ai");
    }
});

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

function closePanel() {
    const panel = window.parent.document.getElementById("aiPanel");
    if (panel) panel.classList.add("ai-hidden");
}
</script>
</body>
</html>
