<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    }

    body {
        background: #120108;
        color: #ffd4e8;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* ── HEADER ── */
    .header {
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Orbitron', monospace;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #1f020d, #2a0312);
        border-bottom: 1px solid rgba(255,105,180,0.18);
        box-shadow: 0 2px 20px rgba(255,80,150,0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ff69b4;
        text-shadow: 0 0 10px rgba(255,105,180,0.6);
    }

    .logo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffb7d5, #ff69b4, #cc2060);
        box-shadow: 0 0 16px rgba(255,105,180,0.7), 0 0 6px rgba(255,105,180,0.4);
        flex-shrink: 0;
        position: relative;
    }
    .logo::after {
        content: '🌸';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        font-size: 14px;
        line-height: 1;
    }

    .close-btn {
        background: transparent;
        border: none;
        color: rgba(255,105,180,0.55);
        font-size: 15px;
        cursor: pointer;
        padding: 5px 9px;
        border-radius: 8px;
        transition: 0.2s;
        line-height: 1;
    }

    .close-btn:hover {
        background: rgba(255,105,180,0.12);
        color: #ff69b4;
        box-shadow: 0 0 10px rgba(255,105,180,0.35);
        transform: scale(1.1);
    }

    /* ── CHAT AREA ── */
    .chat {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #120108;
    }

    /* Subtle scanline */
    .chat::before {
        content: '';
        position: fixed;
        inset: 44px 0 60px 0;
        background: repeating-linear-gradient(
            0deg, transparent, transparent 2px,
            rgba(255,105,180,0.01) 2px, rgba(255,105,180,0.01) 4px
        );
        pointer-events: none;
        z-index: 0;
    }

    .msg {
        max-width: 82%;
        padding: 10px 15px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
        z-index: 1;
        letter-spacing: 0.3px;
        word-break: break-word;
    }

    .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #7a1040, #a01858);
        border: 1px solid rgba(255,105,180,0.3);
        box-shadow: 0 4px 16px rgba(180,30,80,0.35), inset 0 1px 0 rgba(255,150,200,0.2);
        color: #ffeaf4;
    }

    .ai {
        align-self: flex-start;
        background: rgba(40,4,20,0.85);
        border: 1px solid rgba(255,105,180,0.18);
        box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,120,180,0.08);
        color: #ffcce0;
        backdrop-filter: blur(8px);
    }

    /* ── INPUT AREA ── */
    .input-area {
        padding: 12px 14px;
        border-top: 1px solid rgba(255,105,180,0.14);
        display: flex;
        gap: 10px;
        background: #1f020d;
        box-shadow: 0 -2px 20px rgba(255,80,150,0.06);
    }

    input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 22px;
        border: 1px solid rgba(255,105,180,0.25);
        background: rgba(28,4,15,0.85);
        color: #ffd4e8;
        outline: none;
        font-family: 'Rajdhani', sans-serif;
        font-size: 14px;
        letter-spacing: 0.3px;
        transition: 0.3s;
        box-shadow: inset 0 0 12px rgba(255,80,150,0.04);
    }

    input::placeholder { color: rgba(255,105,180,0.32); }

    input:focus {
        border-color: #ff69b4;
        box-shadow: 0 0 0 2px rgba(255,105,180,0.22), 0 0 20px rgba(255,80,150,0.18), inset 0 0 12px rgba(255,80,150,0.06);
    }

    button.send-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 22px;
        background: linear-gradient(135deg, #e8407a, #ff69b4);
        color: white;
        cursor: pointer;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;
        transition: 0.2s;
        box-shadow: 0 4px 0 rgba(140,20,60,0.5), 0 6px 18px rgba(200,40,100,0.35), inset 0 1px 0 rgba(255,200,220,0.3);
    }

    button.send-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 rgba(140,20,60,0.5), 0 10px 25px rgba(255,80,150,0.5), inset 0 1px 0 rgba(255,200,220,0.35);
        background: linear-gradient(135deg, #f05090, #ff85b5);
    }

    button.send-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(140,20,60,0.5), 0 3px 8px rgba(200,40,100,0.3);
    }

    .typing {
        font-size: 13px;
        opacity: 0.6;
        font-style: italic;
        color: rgba(255,182,213,0.6);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f020d; }
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #ff69b4, #cc2060);
        border-radius: 10px;
        box-shadow: 0 0 6px rgba(255,80,150,0.5);
    }
    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #ffb7d5, #ff69b4);
    }
</style>
</head>

<body>

<div class="header">
    <div class="header-left">
        <div class="logo"></div>
        ASSISTANT
    </div>
    <button class="close-btn" onclick="closePanel()">✕</button>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
    <input id="input" placeholder="Type your message..." />
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerHTML = escapeHTML(text);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    const div = document.createElement("div");
    div.className = "msg ai typing";
    div.id = "typing";
    div.innerText = "🌸 thinking...";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}

let sessionId = localStorage.getItem("session_id");
if (!sessionId) {
    sessionId = "electron_" + Math.random().toString(36).substring(2);
    localStorage.setItem("session_id", sessionId);
}

async function sendMessage() {
    const text = input.value.trim();
    const needsPageContext = /what|explain|summarize|this page|what is this/i.test(text);
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    showTyping();

    let pageContent = "";
    if (needsPageContext) {
        try { pageContent = await window.parent.getPageContent(); }
        catch (e) { console.log("Failed to get page content"); }
    }

    try {
        const payload = {
            message: text,
            session_id: sessionId,
            page_content: pageContent,
            url: "electron-app",
            user_agent: navigator.userAgent,
            language: navigator.language,
            timestamp: new Date().toISOString()
        };

        const res = await fetch("https://damn-pb4l.onrender.com/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        removeTyping();
        addMessage(data.answer || "No response", "ai");
    } catch (err) {
        removeTyping();
        addMessage("Server Down", "ai");
        console.error(err);
    }
}

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

function closePanel() {
    const panel = window.parent.document.getElementById("aiPanel");
    if (panel) panel.classList.add("ai-hidden");
}
</script>
</body>
</html>
