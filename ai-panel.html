<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    }

    body {
        background: #080808;
        color: #c8f0d8;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* ── HEADER — BLUE ZONE ── */
    .header {
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Orbitron', monospace;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #000c28, #001240);
        border-bottom: 1px solid rgba(0,100,220,0.45);
        box-shadow: 0 2px 20px rgba(0,80,200,0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #2288ff;
        text-shadow: 0 0 12px rgba(0,100,220,0.8), 0 0 24px rgba(0,80,200,0.4);
    }

    .logo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #55aaff, #0055cc, #003399);
        box-shadow: 0 0 16px rgba(0,100,220,0.8), 0 0 6px rgba(0,120,255,0.5);
        flex-shrink: 0;
        position: relative;
    }
    .logo::after {
        content: '◈';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        font-size: 14px;
        line-height: 1;
        color: #aaddff;
    }

    .close-btn {
        background: transparent;
        border: none;
        color: rgba(200,0,0,0.7);
        font-size: 15px;
        cursor: pointer;
        padding: 5px 9px;
        border-radius: 8px;
        transition: 0.2s;
        line-height: 1;
    }

    .close-btn:hover {
        background: rgba(200,0,0,0.18);
        color: #ff2222;
        box-shadow: 0 0 12px rgba(200,0,0,0.5);
        transform: scale(1.1);
    }

    /* ── CHAT AREA — GREEN ZONE ── */
    .chat {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #080808;
    }

    .chat::before {
        content: '';
        position: fixed;
        inset: 44px 0 60px 0;
        background: repeating-linear-gradient(
            0deg, transparent, transparent 2px,
            rgba(0,200,60,0.008) 2px, rgba(0,200,60,0.008) 4px
        );
        pointer-events: none;
        z-index: 0;
    }

    .msg {
        max-width: 82%;
        padding: 10px 15px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
        z-index: 1;
        letter-spacing: 0.3px;
        word-break: break-word;
    }

    /* USER bubble — RED */
    .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #6a0000, #990000);
        border: 1px solid rgba(200,0,0,0.5);
        box-shadow: 0 4px 16px rgba(180,0,0,0.4), inset 0 1px 0 rgba(255,100,100,0.2);
        color: #ffe8e8;
    }

    /* AI bubble — GREEN */
    .ai {
        align-self: flex-start;
        background: rgba(0,20,8,0.9);
        border: 1px solid rgba(0,180,50,0.35);
        box-shadow: 0 4px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(0,200,60,0.1);
        color: #00ff55;
        backdrop-filter: blur(8px);
    }

    /* ── INPUT AREA — GREEN ZONE ── */
    .input-area {
        padding: 12px 14px;
        border-top: 1px solid rgba(0,180,50,0.25);
        display: flex;
        gap: 10px;
        background: #0a0f0a;
        box-shadow: 0 -2px 20px rgba(0,160,40,0.1);
    }

    input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 22px;
        border: 1px solid rgba(0,180,50,0.35);
        background: rgba(0,15,5,0.9);
        color: #00ff55;
        outline: none;
        font-family: 'Rajdhani', sans-serif;
        font-size: 14px;
        letter-spacing: 0.3px;
        transition: 0.3s;
        box-shadow: inset 0 0 12px rgba(0,150,40,0.05);
    }

    input::placeholder { color: rgba(0,180,50,0.4); }

    input:focus {
        border-color: #00cc44;
        box-shadow: 0 0 0 2px rgba(0,200,60,0.25), 0 0 22px rgba(0,180,50,0.3), inset 0 0 12px rgba(0,150,40,0.08);
    }

    /* SEND BUTTON — BLUE */
    button.send-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 22px;
        background: linear-gradient(135deg, #003399, #0055cc);
        color: #aaddff;
        cursor: pointer;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;
        transition: 0.2s;
        box-shadow: 0 4px 0 rgba(0,20,80,0.6), 0 6px 18px rgba(0,80,200,0.4), inset 0 1px 0 rgba(100,180,255,0.25);
    }

    button.send-btn:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #0044bb, #2277ee);
        box-shadow: 0 6px 0 rgba(0,20,80,0.6), 0 10px 26px rgba(0,100,255,0.55), inset 0 1px 0 rgba(100,180,255,0.3);
        color: #ffffff;
        text-shadow: 0 0 10px #2288ff;
    }

    button.send-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(0,20,80,0.5), 0 3px 8px rgba(0,80,200,0.3);
    }

    .typing {
        font-size: 13px;
        opacity: 0.65;
        font-style: italic;
        color: rgba(0,200,60,0.6);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f0a; }
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #212221, #2e302f);
        border-radius: 10px;
        box-shadow: 0 0 6px rgba(48, 49, 49, 0.55);
    }
    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #141414, #353333);
        box-shadow: 0 0 10px rgba(17, 16, 16, 0.7);
    }
.chat {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #080808;
    position: relative;
}

/* Fixed FIFA watermark */
.chat::after {
    content: "";
    position: absolute;

    top: 50%;
    left: 50%;

    width: 250px;
    height: 250px;

    transform: translate(-50%, -50%);

    background: rgba(255, 0, 0, 0);

    z-index: 9999;
}

/* Messages always above image */
.msg {
    position: relative;
    z-index: 1;
}
.watermark{
    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:250px;

    opacity:0.1;

    pointer-events:none;

    z-index:0;
}

.msg{
    position:relative;
    z-index:1;
}
</style>
</head>

<body>

<div class="header">
    <div class="header-left">
        <div class="logo"></div>
        ASSISTANT
    </div>
    <button class="close-btn" onclick="closePanel()">✕</button>
</div>

<div class="chat" id="chat">

    

    <img src="iui.png" class="watermark">

</div>

</div>

<div class="input-area">
    <input id="input" placeholder="Type your message..." />
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerHTML = escapeHTML(text);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    const div = document.createElement("div");
    div.className = "msg ai typing";
    div.id = "typing";
    div.innerText = " thinking...";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}

let sessionId = localStorage.getItem("session_id");
if (!sessionId) {
    sessionId = "electron_" + Math.random().toString(36).substring(2);
    localStorage.setItem("session_id", sessionId);
}

async function sendMessage() {
    const text = input.value.trim();
    const needsPageContext = /what|explain|summarize|this page|what is this/i.test(text);
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    showTyping();

    let pageContent = "";
    if (needsPageContext) {
        try { pageContent = await window.parent.getPageContent(); }
        catch (e) { console.log("Failed to get page content"); }
    }

    try {
        const payload = {
            message: text,
            session_id: sessionId,
            page_content: pageContent,
            url: "electron-app",
            user_agent: navigator.userAgent,
            language: navigator.language,
            timestamp: new Date().toISOString()
        };

        const res = await fetch("https://damn-8383.onrender.com/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        removeTyping();
        addMessage(data.answer || "No response", "ai");
    } catch (err) {
        removeTyping();
        addMessage("Server Down", "ai");
        console.error(err);
    }
}

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

function closePanel() {
    const panel = window.parent.document.getElementById("aiPanel");
    if (panel) panel.classList.add("ai-hidden");
}
</script>
</body>
</html>
