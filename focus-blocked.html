<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Blocked by Focus Mode</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0b0b10;
    color: #eae6ff;
    font-family: Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    text-align: center;
    max-width: 420px;
    padding: 40px;
  }
  .emoji { font-size: 56px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #b8b0d9; font-size: 14px; line-height: 1.5; }
  .site { color: #a78bfa; font-weight: 600; }
  button {
    margin-top: 22px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    border: none;
    color: white;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧘</div>
    <h1>Focus Mode is on</h1>
    <p><span class="site" id="siteName"></span> is on your distraction list right now. Take a breath — it'll still be there later.</p>
    <button onclick="history.back()">Go back</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("siteName").textContent = params.get("site") || "This site";
  </script>
</body>
</html>
