    </webview>
    <script>
        // Incognito windows are opened with ?incognito=1 (see main.cjs
        // createIncognitoWindow). Swapping to a non "persist:" partition
        // BEFORE the guest starts navigating gives it a fresh in-memory
        // session — no cookies, cache, or history shared with (or written
        // to) the normal "persist:main" session used by regular windows.
        (function () {
            if (new URLSearchParams(location.search).get("incognito") !== "1") return;
            const wv = document.getElementById("browser");
            const fresh = "incognito-" + Date.now() + "-" + Math.random().toString(36).slice(2);
            wv.partition = fresh;
            wv.setAttribute("partition", fresh);
        })();

<script>
// History and Bookmarks share this panel. Everything that comes from a page (its address, its title) is set with
// textContent and wired with addEventListener - never interpolated into innerHTML or an onclick string: a page decides what
// it is called and which address it sits at, and this panel lives in the privileged browser chrome (it can reach window.api).
function openListPanel({ title, actions = [], items, emptyText, label, tooltip, onOpen, onRemove }) {
    document.getElementById("historyPanel")?.remove();
    const panel = document.createElement("div");
    panel.id = "historyPanel";

    const header = document.createElement("div");
    header.className = "panel-header";
    const heading = document.createElement("span");
    heading.textContent = title;
    const tools = document.createElement("span");
    const addTool = (text, hint, run) => {
        const t = document.createElement("span");
        t.textContent = text;
        t.title = hint;
        t.style.cssText = "cursor:pointer;margin-left:12px";
        t.addEventListener("click", run);
        tools.appendChild(t);
    };
    for (const a of actions) addTool(a.text, a.title || "", a.run);
    addTool("✕", "Close", () => panel.remove());
    header.append(heading, tools);

    const body = document.createElement("div");
    body.className = "panel-body";
    if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "panel-item";
        empty.style.cursor = "default";
        empty.textContent = emptyText;
        body.appendChild(empty);
    }
    for (const item of items) {
        const row = document.createElement("div");
        row.className = "panel-item";
        row.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px";
        const text = document.createElement("span");
        text.textContent = label(item);
        text.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
        if (tooltip) text.title = tooltip(item);
        row.appendChild(text);
        row.addEventListener("click", () => onOpen(item));
        if (onRemove) {
            const x = document.createElement("span");
            x.textContent = "✕";
            x.title = "Remove";
            x.style.cssText = "opacity:.6;padding:0 4px";
            x.addEventListener("click", (e) => { e.stopPropagation(); onRemove(item); });
            row.appendChild(x);
        }
        body.appendChild(row);
    }

    panel.append(header, body);
    document.body.appendChild(panel);
}

async function showHistory() {
    try {
        const history = await window.api.getHistory();

        openListPanel({
            title: "🕘 History",
            actions: [{ text: "🗑", title: "Clear history", run: () => clearHistory() }],
            items: history,
            emptyText: "No history",
            label: (url) => url,
            onOpen: (url) => loadURLDirect(url),
        });

    } catch (err) {
        console.error("History error:", err);
        alert("History failed to load");
    }
}
async function clearHistory() {
    await window.api.clearHistory();
    showHistory(); // refresh UI
}
</script>

<script>
const urlbar = document.getElementById("urlBar");

/* 🔁 Function to update URL bar display */
function updateURLBar(url) {
    if (!url) return;

    if (url.startsWith("file://")) {
        // Hide local file path
        urlbar.value = ""; // or "Local File"
    } else {
        urlbar.value = url;
    }
}

/* 🚀 Example: when loading a page */
function loadPage(url) {
    // Your existing logic to load page (iframe/webview/etc)

    updateURLBar(url);
}

/* 🧠 Optional: when user presses Enter */
function isLikelyURL(input) {
    // If it already has protocol
    if (input.startsWith("http://") || input.startsWith("https://") || input.startsWith("file://")) {
        return true;
    }

    // If it looks like a domain (contains dot, no spaces)
    if (input.includes(".") && !input.includes(" ")) {
        return true;
    }

    return false;
}

urlbar.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const input = urlbar.value.trim();
        let url;

        if (isLikelyURL(input)) {
            // Add https if missing
            if (!input.startsWith("http") && !input.startsWith("file://")) {
                url = "https://" + input;
            } else {
                url = input;
            }
        } else {
            // Google search
            url = "https://www.google.com/search?q=" + encodeURIComponent(input);
        }

        loadPage(url);
    }
});
setInterval(() => {
    if (urlbar.value.startsWith("file://")) {
        urlbar.value = ""; // or "Local File"
    }
}, 200);
</script>
<script>
    const suggestionBox = document.getElementById("suggestionsBox");
    document.body.appendChild(suggestionBox);

// 🔥 FETCH REAL SUGGESTIONS
    async function fetchSuggestions(query) {
        try {
            const res = await fetch(`https://duckduckgo.com/ac/?q=${query}`);
            const data = await res.json();
            return data.map(x => x.phrase);
        } catch {
            return [];
        }
    }

    // 🔥 INPUT LISTENER (DOES NOT BREAK YOUR ENTER LOGIC)
    urlBar.addEventListener("input", async () => {
        const value = urlBar.value.trim();

        if (!value) {
            suggestionBox.style.display = "none";
            return;
        }

        positionSuggestions(); // 🔥 THIS FIXES EVERYTHING

        let suggestions = await fetchSuggestions(value);

        suggestions.unshift(`Search "${value}"`);

        if (value.includes(".") && !value.includes(" ")) {
            suggestions.unshift("https://" + value);
        }

        suggestionBox.innerHTML = "";

        suggestions.slice(0, 6).forEach(text => {
            const div = document.createElement("div");
            div.className = "suggestion-item";
            div.textContent = text;

            div.onclick = () => handleSuggestionClick(text, value);

            suggestionBox.appendChild(div);
        });

        suggestionBox.style.display = "block";
    });
    function positionSuggestions() {
        const rect = urlBar.getBoundingClientRect();

        suggestionBox.style.top = rect.bottom + "px";
        suggestionBox.style.left = rect.left + "px";
        suggestionBox.style.width = rect.width + "px";
    }

    // 🔥 CLICK HANDLER
    function handleSuggestionClick(item, original) {
        suggestionBox.style.display = "none";

        let url;

        // 🧠 If it's a search suggestion OR not a valid URL
        if (
            item.startsWith("Search") ||
            (!item.includes(".") && !item.startsWith("http"))
        ) {
            url = "https://www.google.com/search?q=" + encodeURIComponent(item);
        } 
        else {
            url = item.startsWith("http") ? item : "https://" + item;
        }

        const currentTab = tabData[activeTabIndex];

        if (currentTab && currentTab.webview) {
            currentTab.webview.loadURL(url);
            currentTab.url = url;
        }
    }
    window.addEventListener("resize", positionSuggestions);
    window.addEventListener("scroll", positionSuggestions);

    // 🔥 HIDE ON BLUR
    urlBar.addEventListener("blur", () => {
        setTimeout(() => suggestionBox.style.display = "none", 150);
    });
</script>

<script>
async function openCitationOverlay() {
    const currentTab = tabData[activeTabIndex];
    const webview = currentTab?.webview;
    if (!webview) return;

    const data = await webview.executeJavaScript(`
        ({
            title: document.title,
            url: location.href,
            author: document.querySelector("meta[name='author']")?.content,
            published: document.querySelector("meta[property='article:published_time']")?.content,
            siteName: document.querySelector("meta[property='og:site_name']")?.content
        })
    `);

    webview.executeJavaScript(`
        (function() {

            // Remove existing panel if already open
            const old = document.getElementById("jonah-cite-panel");
            if (old) old.remove();

            const data = ${JSON.stringify(data)};

            function getSiteName(d) {
                return d.siteName || location.hostname.replace("www.", "");
            }

            function getAuthor(d) {
                return d.author || getSiteName(d);
            }

            function getDateAPA(d) {
                if (!d.published) return "(n.d.)";
                const date = new Date(d.published);
                return "(" + date.getFullYear() + ")";
            }

            function cleanTitle(title) {
                return title ? title.split(" - ")[0] : "";
            }

            function formatAPA(d) {
                return getAuthor(d) + ". " + getDateAPA(d) + ". " + cleanTitle(d.title) + ". " + d.url;
            }

            function formatMLA(d) {
                return '"' + cleanTitle(d.title) + '." ' + getSiteName(d) + ", " + d.url + ".";
            }

            // Create panel
            const panel = document.createElement("div");
            panel.id = "jonah-cite-panel";

            panel.innerHTML = \`
                <div class="header">
                    📄 Citation
                    <span id="closeBtn">✕</span>
                </div>

                <div class="box">
                    <strong>APA</strong>
                    <p id="apa">\${formatAPA(data)}</p>
                    <button onclick="navigator.clipboard.writeText(document.getElementById('apa').innerText)">Copy</button>
                </div>

                <div class="box">
                    <strong>MLA</strong>
                    <p id="mla">\${formatMLA(data)}</p>
                    <button onclick="navigator.clipboard.writeText(document.getElementById('mla').innerText)">Copy</button>
                </div>
            \`;

            // Styles (futuristic 🔥)
            const style = document.createElement("style");
            style.innerHTML = \`
                #jonah-cite-panel {
                    all: initial;
                    position: fixed;
                    top: 50px; /* 🔼 pushed slightly up */
                    right: 20px;
                    width: 350px;
                    max-height: 80vh;
                    overflow-y: auto;
                    background: rgba(255,105,180,0.48);
                    color: black;
                    font-family: Arial;
                    border-radius: 12px;
                    box-shadow: 0 0 25px rgba(0,234,255,0.4);
                    border: 1px solid rgba(255,105,180,0.48);
                    z-index: 1000000;
                    backdrop-filter: blur(12px);
                    animation: fadeIn 0.3s ease;
                    scroll-behavior: smooth;
                }

                /* 🔥 Futuristic Scrollbar */
                #jonah-cite-panel::-webkit-scrollbar {
                    width: 8px;
                }

                #jonah-cite-panel::-webkit-scrollbar-track {

                    border-radius: 10px;

                #jonah-cite-panel::-webkit-scrollbar-thumb:hover {

                #jonah-cite-panel .header {

                #jonah-cite-panel .box {

                #jonah-cite-panel button {

            \`;

            document.head.appendChild(style);
            document.body.appendChild(panel);

            document.getElementById("closeBtn").onclick = () => panel.remove();

<script>
const webview = document.getElementById("browser");
const urlBar = document.getElementById("urlBar");

/////////////////////////////////////////////////////
// 🔥 USER + AI USE SAME URL BAR
/////////////////////////////////////////////////////
function openInNewTab(url) {

    const tabBar = document.querySelector(".tab-bar");

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

    const tab = document.createElement("div");
    tab.className = "tab active";

    tab.innerHTML = `
        <span>New Tab</span>
        <span class="close-tab">✕</span>
    `;

    tabBar.appendChild(tab);

    const currentTab = tabData[activeTabIndex];

    if (currentTab && currentTab.webview) {
        currentTab.webview.loadURL(url);
        currentTab.url = url;
    } // ✅ THIS is what actually loads
}
webview.addEventListener("dom-ready", () => {

    webview.setWindowOpenHandler(({ url }) => {

        console.log("🔥 Popup → new tab:", url);

        if (url && url.startsWith("http")) {
            createNewTab(url);
        } else {
            console.warn("⚠️ Blocked invalid popup:", url);
        }

        return { action: "deny" };
    });

});


urlBar.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {

        // Hide suggestions immediately
        suggestionBox.style.display = "none";
        suggestionBox.innerHTML = "";

        loadURL();
    }
});

/////////////////////////////////////////////////////
// 🤖 AI TYPES IN URL BAR
/////////////////////////////////////////////////////

window.api.onTypeURL(async (e, text) => {

    urlBar.focus();
    urlBar.value = "";

    for (let i = 0; i < text.length; i++) {
        urlBar.value += text[i];
        await new Promise(r => setTimeout(r, 80));
    }
});

/////////////////////////////////////////////////////
// 🤖 AI PRESSES ENTER
/////////////////////////////////////////////////////

window.api.onPressEnterURL(() => {
    const event = new KeyboardEvent("keydown", { key: "Enter" });
    urlBar.dispatchEvent(event);
});

/////////////////////////////////////////////////////
// 🔄 SYNC URL BAR WITH PAGE
/////////////////////////////////////////////////////

function formatURL(url) {

    // 🔒 Hide local file paths
    if (url.startsWith("file://")) {

        if (url.includes("google-blocked.html")) {
            return "Jonah://blocked";
        }

        if (url.includes("home.html")) {
            return "";
        }

        return "";
    }

    return url;
}



webview.addEventListener("did-navigate-in-page", (e) => {
    urlBar.value = formatURL(e.url);
});
webview.addEventListener("did-fail-load", (e) => {

    // 🔥 ONLY handle real page failures
    if (!e.isMainFrame) return;

    // ignore harmless aborts
    if (e.errorCode === -3) return;

    // ignore your custom blocked page
    if (e.validatedURL && e.validatedURL.includes("google-blocked.html")) {
        return;
    }

    console.log("🚨 REAL PAGE FAIL:", e);

    const fatalErrors = [-105, -106, -118]; // DNS / connection

    if (!fatalErrors.includes(e.errorCode)) return;

    let type = "failed";

    if (e.errorDescription?.toLowerCase().includes("internet")) {
        type = "offline";
    }

    const errorPage = `file://${location.pathname.replace("index.html", "")}error.html?type=${type}`;

    webview.loadURL(errorPage);
});
</script>
<script>
window.api.onNavigate((e, url) => {
    document.querySelector("webview").loadURL(url);
});

window.api.onInjectJS((e, code) => {
    document.querySelector("webview").executeJavaScript(code);
});
</script>
