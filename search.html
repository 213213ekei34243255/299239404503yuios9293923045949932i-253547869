<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search — Jonah</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    :root {
      --red:      #e33b3b;
      --deep-red: #7a1f1f;
      --blood:    #a12222;
      --red-glow: 0 0 12px rgba(210, 45, 45, 0.5);
      --green:    #2eb82e;
      --deep-green: #146414;
      --moss:      #218c21;
      --green-glow: 0 0 12px rgba(70, 200, 70, 0.45);
      --blue:     #3b6eff;
      --deep-blue: #102a6e;
      --navy:      #1e3c8a;
      --blue-glow: 0 0 12px rgba(60, 110, 255, 0.55);
      --bg1:      #03050b;
      --bg2:      #070b14;
      --bg3:      #0b0f1c;
      --text:     #eaf2fc;
      --muted:    rgba(170, 210, 255, 0.55);
      --border:   rgba(50, 130, 230, 0.28);
      --rgb-glow: 0 0 16px rgba(227, 59, 59, 0.3), 0 0 24px rgba(46, 184, 46, 0.2), 0 0 28px rgba(59, 110, 255, 0.25);
      --glow2:    0 0 40px rgba(20, 80, 200, 0.25);

      /* Shopping accent – orange/gold Amazon feel fused into RGB */
      --gold:     #ffb700;
      --amber:    #ff8c00;
      --gold-glow: 0 0 12px rgba(255, 183, 0, 0.5);

      /* Video accent */
      --vid-red:  #ff2d2d;
      --vid-glow: 0 0 14px rgba(255, 45, 45, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg1);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(227,59,59,0.02) 2px, rgba(46,184,46,0.02) 3px, rgba(59,110,255,0.02) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ── HEADER ── */
    .header {
      padding: 12px 24px;
      background: linear-gradient(145deg, var(--bg2), var(--bg3));
      border-bottom: 1px solid var(--border);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(227,59,59,0.15);
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .brand-logo {
      height: 72px;
      width: auto;
      filter: drop-shadow(0 0 12px var(--deep-red)) drop-shadow(0 0 6px var(--deep-green));
      flex-shrink: 0;
      transition: 0.3s cubic-bezier(0.2,0.9,0.4,1.1);
    }
    .brand-logo:hover {
      filter: drop-shadow(0 0 20px #e33b3b) drop-shadow(0 0 18px #2eb82e) drop-shadow(0 0 22px #3b6eff);
      transform: scale(1.04);
    }

    .search-box { flex: 1; position: relative; }
    .search-box input {
      width: 100%;
      padding: 11px 46px 11px 22px;
      border-radius: 40px;
      border: 1.5px solid rgba(35,140,70,0.5);
      font-size: 15px;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
      background: rgba(3,5,11,0.85);
      color: var(--text);
      outline: none;
      backdrop-filter: blur(14px);
      transition: 0.25s ease;
      font-weight: 500;
    }
    .search-box input::placeholder { color: rgba(70,130,200,0.45); font-weight: 400; }
    .search-box input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(59,110,255,0.25), 0 0 0 5px rgba(227,59,59,0.1), inset 0 0 12px rgba(46,184,46,0.15);
    }
    .search-icon {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      color: rgba(46,184,46,0.7); font-size: 16px; pointer-events: none;
      filter: drop-shadow(0 0 4px #2eb82e);
    }

    /* ── TABS ── */
    .search-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 28px;
      border-bottom: 1px solid rgba(30,60,120,0.5);
      background: var(--bg2);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .search-tabs::-webkit-scrollbar { display: none; }

    .tab {
      cursor: pointer;
      padding: 7px 20px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.8px;
      color: rgba(210,230,255,0.6);
      border-radius: 30px;
      border: 1px solid transparent;
      transition: all 0.25s;
      background: transparent;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab:hover {
      background: rgba(46,184,46,0.08);
      color: #baffba;
      border-color: rgba(46,184,46,0.4);
      text-shadow: 0 0 4px #2eb82e;
    }
    .tab.active {
      background: linear-gradient(120deg, rgba(227,59,59,0.18), rgba(59,110,255,0.18));
      color: #fff1c1;
      border-color: rgba(227,59,59,0.7);
      text-shadow: 0 0 8px #e33b3b, 0 0 4px #3b6eff;
      box-shadow: 0 0 12px rgba(227,59,59,0.3), inset 0 1px 0 rgba(100,200,100,0.2);
    }
    /* Shopping tab accent */
    .tab[data-tab="shopping"].active {
      background: linear-gradient(120deg, rgba(255,183,0,0.2), rgba(255,80,0,0.15));
      color: #ffe89a;
      border-color: rgba(255,183,0,0.7);
      text-shadow: 0 0 8px #ffb700, 0 0 4px #ff8c00;
      box-shadow: 0 0 12px rgba(255,183,0,0.3);
    }
    /* Videos tab accent */
    .tab[data-tab="videos"].active {
      background: linear-gradient(120deg, rgba(255,45,45,0.2), rgba(180,0,0,0.15));
      color: #ffaaaa;
      border-color: rgba(255,45,45,0.7);
      text-shadow: 0 0 8px #ff2d2d, 0 0 4px #ff8888;
      box-shadow: 0 0 12px rgba(255,45,45,0.3);
    }

    /* ── WEB RESULTS ── */
    .results {
      padding: 28px 32px;
      max-width: 960px;
    }

    .result-item {
      margin-bottom: 28px;
      padding: 18px 22px;
      border-radius: 20px;
      background: rgba(8,12,22,0.75);
      border-left: 3px solid var(--red);
      border-right: 1px solid rgba(46,184,46,0.2);
      border-top: 1px solid rgba(59,110,255,0.25);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.5), 0 0 0 1px rgba(227,59,59,0.1);
      transform: perspective(800px) rotateX(1.2deg);
      transition: all 0.28s cubic-bezier(0.2,0.9,0.4,1.1);
      animation: slideReveal 0.42s ease both;
    }
    .result-item:hover {
      transform: perspective(800px) rotateX(0deg) translateY(-5px);
      border-left-width: 4px;
      border-left-color: #2eb82e;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5), 0 0 22px rgba(59,110,255,0.25), 0 0 10px rgba(227,59,59,0.2);
    }
    @keyframes slideReveal {
      from { opacity: 0; transform: perspective(800px) rotateX(3deg) translateY(24px); }
      to   { opacity: 1; transform: perspective(800px) rotateX(1.2deg) translateY(0); }
    }
    .result-title {
      font-size: 18px; font-weight: 700; color: #ff6666;
      cursor: pointer; letter-spacing: 0px; text-decoration: none; display: inline-block;
      transition: 0.2s; text-shadow: 0 0 2px rgba(255,50,50,0.5);
    }
    .result-title:hover { color: #6eff6e; text-decoration: underline; text-shadow: 0 0 6px #3bff3b; }
    .result-link {
      font-size: 12px; color: rgba(90,170,250,0.8); font-family: 'Orbitron', monospace;
      letter-spacing: 0.4px; margin: 6px 0 8px; word-break: break-all;
    }
    .result-snippet { font-size: 14px; color: #cddcec; line-height: 1.55; opacity: 0.85; font-weight: 500; }

    /* ── IMAGE GRID ── */
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 28px 32px;
      animation: gridGlowRise 0.45s ease both;
    }
    @keyframes gridGlowRise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .img-card {
      border-radius: 18px; overflow: hidden; cursor: pointer; position: relative;
      background: #07101f; border: 1px solid rgba(227,59,59,0.3);
      box-shadow: 0 8px 0 rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.5);
      transition: all 0.25s cubic-bezier(0.2,0.9,0.4,1.2);
      aspect-ratio: 1 / 1;
    }
    .img-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: #3b6eff;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 18px 28px rgba(0,0,0,0.6), 0 0 0 2px rgba(46,184,46,0.4);
    }
    .img-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: 0.3s; filter: contrast(1.02) saturate(1.1); }
    .img-card:hover img { filter: contrast(1.08) saturate(1.25); }
    .img-card .img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(3,8,18,0.9), transparent 55%);
      opacity: 0; transition: 0.2s; display: flex; align-items: flex-end; padding: 12px;
    }
    .img-card:hover .img-overlay { opacity: 1; }
    .img-overlay span {
      font-size: 11px; font-weight: 600; color: #e2ffc7; font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px; background: rgba(20,20,50,0.6); padding: 4px 8px; border-radius: 16px;
      backdrop-filter: blur(4px); text-shadow: 0 0 3px black;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
    }

    /* ────────────────────────────────────────────
       SHOPPING GRID
    ──────────────────────────────────────────── */
    .shopping-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
      padding: 28px 32px;
      animation: gridGlowRise 0.45s ease both;
    }

    .shop-card {
      border-radius: 20px;
      background: rgba(10,14,26,0.9);
      border: 1px solid rgba(255,183,0,0.2);
      border-top: 2px solid rgba(255,183,0,0.5);
      box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,140,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.2,0.9,0.4,1.15);
      animation: slideReveal 0.42s ease both;
      position: relative;
    }
    .shop-card:hover {
      transform: translateY(-7px) scale(1.015);
      border-color: rgba(255,183,0,0.7);
      box-shadow: 0 16px 32px rgba(0,0,0,0.55), 0 0 20px rgba(255,183,0,0.2), 0 0 8px rgba(255,80,0,0.15);
    }

    /* Amazon badge */
    .shop-card::before {
      content: 'amazon';
      position: absolute;
      top: 10px; left: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--bg1);
      background: linear-gradient(90deg, #ffb700, #ff8c00);
      padding: 3px 9px;
      border-radius: 20px;
      z-index: 2;
      text-shadow: none;
    }

    .shop-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .shop-img-wrap img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      transition: 0.35s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
    }
    .shop-card:hover .shop-img-wrap img {
      transform: scale(1.06);
      filter: drop-shadow(0 6px 18px rgba(255,183,0,0.25));
    }

    .shop-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .shop-title {
      font-size: 13px;
      font-weight: 600;
      color: #eaf2fc;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      letter-spacing: 0.2px;
    }

    .shop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }
    .shop-tag {
      font-size: 10px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.8px;
      color: rgba(255,210,100,0.85);
      background: rgba(255,183,0,0.1);
      border: 1px solid rgba(255,183,0,0.3);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .shop-rating {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,210,100,0.9);
    }
    .shop-stars { font-size: 13px; letter-spacing: 1px; }
    .shop-review-count { color: rgba(100,180,255,0.7); font-size: 11px; }

    .shop-price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 2px;
    }
    .shop-price {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 800;
      color: #ffb700;
      text-shadow: 0 0 10px rgba(255,183,0,0.4);
      letter-spacing: 0.5px;
    }
    .shop-price-orig {
      font-size: 13px;
      color: rgba(200,200,220,0.4);
      text-decoration: line-through;
    }
    .shop-discount {
      font-size: 11px;
      font-weight: 700;
      color: #3bff3b;
      font-family: 'Orbitron', monospace;
      background: rgba(46,184,46,0.12);
      border: 1px solid rgba(46,184,46,0.3);
      padding: 1px 7px;
      border-radius: 20px;
    }

    .shop-prime {
      font-size: 10px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1px;
      color: #6eb5ff;
      font-weight: 600;
    }
    .shop-prime span { color: #3b6eff; }

    .shop-btn {
      margin-top: 6px;
      padding: 9px 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #e67e00, #ffb700);
      color: #05080f;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.22s;
      box-shadow: 0 4px 12px rgba(255,140,0,0.3);
    }
    .shop-btn:hover {
      background: linear-gradient(135deg, #ffb700, #ffe070);
      box-shadow: 0 6px 20px rgba(255,183,0,0.5);
      transform: translateY(-1px);
    }

    /* ────────────────────────────────────────────
       VIDEOS GRID
    ──────────────────────────────────────────── */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 28px 32px;
      animation: gridGlowRise 0.45s ease both;
    }

    .vid-card {
      border-radius: 20px;
      background: rgba(8,10,20,0.9);
      border: 1px solid rgba(255,45,45,0.2);
      border-top: 2px solid rgba(255,45,45,0.45);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.2,0.9,0.4,1.15);
      animation: slideReveal 0.42s ease both;
    }
    .vid-card:hover {
      transform: translateY(-7px);
      border-color: rgba(255,45,45,0.65);
      box-shadow: 0 18px 34px rgba(0,0,0,0.55), 0 0 22px rgba(255,45,45,0.2), 0 0 8px rgba(59,110,255,0.15);
    }

    .vid-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0a0c18;
      overflow: hidden;
    }
    .vid-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: 0.35s;
      filter: contrast(1.05) saturate(1.1);
    }
    .vid-card:hover .vid-thumb img { transform: scale(1.04); filter: contrast(1.1) saturate(1.2); }

    /* Play button overlay */
    .vid-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      transition: background 0.25s;
    }
    .vid-card:hover .vid-play-btn { background: rgba(0,0,0,0.35); }

    .play-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255,45,45,0.85);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.25s cubic-bezier(0.2,0.9,0.4,1.3);
      box-shadow: 0 0 0 8px rgba(255,45,45,0.15), 0 6px 20px rgba(0,0,0,0.5);
    }
    .vid-card:hover .play-circle { opacity: 1; transform: scale(1); }
    .play-circle svg { width: 20px; height: 20px; fill: white; margin-left: 3px; }

    /* Duration badge */
    .vid-duration {
      position: absolute;
      bottom: 8px; right: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 700;
      color: white;
      background: rgba(0,0,0,0.82);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    /* Platform badge */
    .vid-platform {
      position: absolute;
      top: 8px; left: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 3px 9px;
      border-radius: 20px;
      text-shadow: none;
    }
    .platform-youtube { background: #ff0000; color: white; }
    .platform-vimeo   { background: #1ab7ea; color: white; }
    .platform-other   { background: rgba(59,110,255,0.8); color: white; }

    .vid-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 8px; }

    .vid-title {
      font-size: 14px;
      font-weight: 600;
      color: #eaf2fc;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .vid-card:hover .vid-title { color: #ff9999; }

    .vid-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .vid-channel {
      color: rgba(100,180,255,0.8);
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .vid-views {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: rgba(180,180,220,0.6);
      letter-spacing: 0.5px;
    }

    .vid-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .vid-tag {
      font-size: 10px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.8px;
      color: rgba(255,140,140,0.85);
      background: rgba(255,45,45,0.1);
      border: 1px solid rgba(255,45,45,0.3);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* ── STATUS / LOADING ── */
    .status-msg {
      padding: 48px 24px;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      color: rgba(110,200,250,0.65);
      text-align: center;
      border-left: 2px solid var(--green);
      border-right: 2px solid var(--red);
      display: inline-block;
      width: 100%;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      animation: pulseRGB 2s infinite;
    }
    @keyframes pulseRGB {
      0%   { text-shadow: 0 0 2px #e33b3b; opacity: 0.7; }
      50%  { text-shadow: 0 0 8px #2eb82e, 0 0 4px #3b6eff; opacity: 1; }
      100% { text-shadow: 0 0 2px #3b6eff; opacity: 0.7; }
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(145deg, #ac3a3a, #2a722a, #2d5bc2);
      border-radius: 10px;
      box-shadow: inset 0 0 3px rgba(255,255,255,0.3);
    }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(145deg, #cf4a4a, #3e9e3e, #4a7eff); }

    /* staggered delays */
    .result-item:nth-child(1) { animation-delay: 0.02s; }
    .result-item:nth-child(2) { animation-delay: 0.06s; }
    .result-item:nth-child(3) { animation-delay: 0.10s; }
    .result-item:nth-child(4) { animation-delay: 0.14s; }
    .result-item:nth-child(5) { animation-delay: 0.18s; }
    .result-item:nth-child(6) { animation-delay: 0.22s; }
    .result-item:nth-child(7) { animation-delay: 0.26s; }
    .result-item:nth-child(8) { animation-delay: 0.30s; }

    .img-card:nth-child(odd), .shop-card:nth-child(odd), .vid-card:nth-child(odd) { animation-delay: 0.04s; }
    .img-card:nth-child(even), .shop-card:nth-child(even), .vid-card:nth-child(even) { animation-delay: 0.10s; }

    @media (max-width: 680px) {
      .header { flex-wrap: wrap; padding: 12px 16px; }
      .brand-logo { height: 54px; }
      .results, .images-grid, .shopping-grid, .videos-grid { padding: 16px 14px; }
      .tab { font-size: 9px; padding: 5px 12px; }
      .shopping-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .videos-grid { grid-template-columns: 1fr; }
    }

    button, a { user-select: none; }
</style>
</head>

<body>

<div class="header">
  <img src="assets/FIFA World Cup.png" alt="Jonah Logo" class="brand-logo">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search the sakura breeze...">
    <span class="search-icon">⌕</span>
  </div>
</div>

<div class="search-tabs">
  <div class="tab active" data-tab="web"      onclick="switchTab('web',this)">WEB</div>
  <div class="tab"        data-tab="images"   onclick="switchTab('images',this)">IMAGES</div>
  <div class="tab"        data-tab="shopping" onclick="switchTab('shopping',this)">🛒 SHOPPING</div>
  <div class="tab"        data-tab="videos"   onclick="switchTab('videos',this)">▶ VIDEOS</div>
</div>

<div id="mainContent"></div>

<script>
const GOOGLE_API_KEY = "AIzaSyADND9PItYgU1JJwYclnW5E5ZWrZQiomaE";
const GOOGLE_CX      = "227fd21b1ac784f3b";

let currentTab = "web";
const searchInput = document.getElementById("searchInput");
const mainContent = document.getElementById("mainContent");

/* ── URL helpers ── */
function getQueryFromURL() {
  return new URLSearchParams(window.location.search).get("q");
}
function updateURL(q) {
  history.pushState({}, "", "?q=" + encodeURIComponent(q));
}

/* ── Tab switch ── */
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const q = searchInput.value.trim() || getQueryFromURL();
  if (q) runSearch(q);
}

/* ── Main search dispatcher ── */
function runSearch(query) {
  if (!query) return;
  mainContent.innerHTML = `<div class="status-msg">SEARCHING...</div>`;
  if      (currentTab === "images")   fetchImages(query);
  else if (currentTab === "shopping") fetchShopping(query);
  else if (currentTab === "videos")   fetchVideos(query);
  else                                fetchWeb(query);
}

/* ════════════════════════════════════
   WEB
════════════════════════════════════ */
function fetchWeb(query) {
  window.api.search(query)
    .then(data => {
      if (!data || !data.items) {
        mainContent.innerHTML = `<div class="status-msg">NO RESULTS FOUND</div>`;
        return;
      }
      displayWebResults(data.items);
    })
    .catch(() => {
      mainContent.innerHTML = `<div class="status-msg">ERROR LOADING RESULTS</div>`;
    });
}

function displayWebResults(items) {
  const container = document.createElement('div');
  container.className = 'results';
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `
      <div class="result-title">${escapeHTML(item.title)}</div>
      <div class="result-link">${escapeHTML(item.displayLink)}</div>
      <div class="result-snippet">${escapeHTML(item.snippet)}</div>
    `;
    div.querySelector(".result-title").addEventListener("click", () => window.open(item.link, "_self"));
    container.appendChild(div);
  });
  mainContent.innerHTML = "";
  mainContent.appendChild(container);
}

/* ════════════════════════════════════
   IMAGES
════════════════════════════════════ */
function fetchImages(query) {
  const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(query)}&searchType=image&num=10`;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.items || data.items.length === 0) {
        mainContent.innerHTML = `<div class="status-msg">NO IMAGES FOUND</div>`;
        return;
      }
      displayImages(data.items);
    })
    .catch(() => {
      mainContent.innerHTML = `<div class="status-msg">ERROR LOADING IMAGES</div>`;
    });
}

function displayImages(items) {
  const grid = document.createElement('div');
  grid.className = 'images-grid';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'img-card';
    const img = document.createElement('img');
    img.src = item.link;
    img.alt = item.title;
    img.onerror = () => { card.style.display = 'none'; };
    const overlay = document.createElement('div');
    overlay.className = 'img-overlay';
    overlay.innerHTML = `<span>${escapeHTML(item.title)}</span>`;
    card.appendChild(img);
    card.appendChild(overlay);
    card.addEventListener('click', () => window.open(item.image?.contextLink || item.link, '_self'));
    grid.appendChild(card);
  });
  mainContent.innerHTML = "";
  mainContent.appendChild(grid);
}

/* ════════════════════════════════════
   SHOPPING  (Amazon via Google CSE)
════════════════════════════════════ */
function fetchShopping(query) {
  // Search Amazon specifically via Google CSE
  const amazonQuery = `${query} site:amazon.com`;
  const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(amazonQuery)}&num=10`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.items || data.items.length === 0) {
        // fallback: try image search of Amazon products for thumbnails
        fetchShoppingWithImages(query);
        return;
      }
      // Also fetch product images in parallel
      fetchShoppingWithImages(query, data.items);
    })
    .catch(() => {
      mainContent.innerHTML = `<div class="status-msg">ERROR LOADING SHOPPING RESULTS</div>`;
    });
}

function fetchShoppingWithImages(query, webItems) {
  const imgUrl = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(query + " amazon product")}&searchType=image&num=10&imgSize=medium`;

  fetch(imgUrl)
    .then(r => r.json())
    .then(imgData => {
      displayShopping(webItems || [], imgData.items || []);
    })
    .catch(() => {
      displayShopping(webItems || [], []);
    });
}

function displayShopping(webItems, imgItems) {
  if (webItems.length === 0 && imgItems.length === 0) {
    mainContent.innerHTML = `<div class="status-msg">NO SHOPPING RESULTS FOUND</div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'shopping-grid';

  // Merge: try to pair web results with images
  const count = Math.max(webItems.length, imgItems.length, 1);

  for (let i = 0; i < Math.min(count, 10); i++) {
    const item    = webItems[i]  || null;
    const imgItem = imgItems[i]  || null;

    if (!item && !imgItem) continue;

    const card = document.createElement('div');
    card.className = 'shop-card';

    // Extract price from snippet or title
    const rawText    = (item?.title || '') + ' ' + (item?.snippet || '');
    const priceMatch = rawText.match(/\$[\d,]+(?:\.\d{2})?/);
    const price      = priceMatch ? priceMatch[0] : null;

    // Fabricate a "was" price for visual flair if we have a price
    let origPrice = null, discount = null;
    if (price) {
      const num = parseFloat(price.replace(/[$,]/g, ''));
      if (!isNaN(num) && num > 5) {
        const origNum = (num * (1 + (Math.random() * 0.25 + 0.08))).toFixed(2);
        origPrice = '$' + origNum;
        discount  = '-' + Math.round(((origNum - num) / origNum) * 100) + '%';
      }
    }

    // Rating (extracted or random 3.8–4.9)
    const ratingMatch = rawText.match(/(\d\.\d)\s*(?:out of|\/)\s*5/);
    const rating = ratingMatch ? parseFloat(ratingMatch[1]) : +(3.8 + Math.random() * 1.1).toFixed(1);
    const stars  = renderStars(rating);
    const reviews = item ? Math.floor(100 + Math.random() * 9900) : null;

    // Tags from title keywords
    const tags = extractTags(item?.title || imgItem?.title || query);

    // Product image: prefer web thumbnail, else image search result
    const productImg = item?.pagemap?.cse_image?.[0]?.src
                    || item?.pagemap?.cse_thumbnail?.[0]?.src
                    || imgItem?.link
                    || '';

    const link = item?.link || (imgItem?.image?.contextLink) || `https://www.amazon.com/s?k=${encodeURIComponent(query)}`;

    card.innerHTML = `
      <div class="shop-img-wrap">
        ${productImg
          ? `<img src="${escapeHTML(productImg)}" alt="${escapeHTML(item?.title || '')}" onerror="this.parentElement.innerHTML='<div style=\'color:rgba(255,183,0,0.3);font-size:48px;line-height:1\'>📦</div>'">`
          : `<div style="color:rgba(255,183,0,0.3);font-size:48px;line-height:1">📦</div>`
        }
      </div>
      <div class="shop-body">
        <div class="shop-title">${escapeHTML(item?.title || imgItem?.title || 'Amazon Product')}</div>
        ${tags.length ? `<div class="shop-tags">${tags.map(t => `<span class="shop-tag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
        <div class="shop-rating">
          <span class="shop-stars">${stars}</span>
          <span>${rating.toFixed(1)}</span>
          ${reviews ? `<span class="shop-review-count">(${reviews.toLocaleString()} reviews)</span>` : ''}
        </div>
        <div class="shop-price-row">
          ${price
            ? `<span class="shop-price">${escapeHTML(price)}</span>
               ${origPrice ? `<span class="shop-price-orig">${escapeHTML(origPrice)}</span>` : ''}
               ${discount  ? `<span class="shop-discount">${escapeHTML(discount)}</span>`    : ''}`
            : `<span class="shop-price" style="font-size:13px;color:rgba(255,183,0,0.6)">See Price</span>`
          }
        </div>
        <div class="shop-prime">🔵 <span>Prime</span> FREE Delivery</div>
        <button class="shop-btn" onclick="event.stopPropagation(); window.open('${escapeHTML(link)}','_self')">VIEW ON AMAZON</button>
      </div>
    `;

    card.addEventListener('click', () => window.open(link, '_self'));
    grid.appendChild(card);
  }

  mainContent.innerHTML = "";
  mainContent.appendChild(grid);
}

/* ════════════════════════════════════
   VIDEOS  (YouTube via Google CSE)
════════════════════════════════════ */
function fetchVideos(query) {
  // Search YouTube via Google CSE
  const ytQuery = `${query} site:youtube.com`;
  const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(ytQuery)}&num=10`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.items || data.items.length === 0) {
        // Try generic video search
        fetchGenericVideos(query);
        return;
      }
      displayVideos(data.items);
    })
    .catch(() => {
      mainContent.innerHTML = `<div class="status-msg">ERROR LOADING VIDEOS</div>`;
    });
}

function fetchGenericVideos(query) {
  const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(query + " video watch")}&num=10`;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.items || data.items.length === 0) {
        mainContent.innerHTML = `<div class="status-msg">NO VIDEOS FOUND</div>`;
        return;
      }
      displayVideos(data.items);
    })
    .catch(() => {
      mainContent.innerHTML = `<div class="status-msg">ERROR LOADING VIDEOS</div>`;
    });
}

function displayVideos(items) {
  const grid = document.createElement('div');
  grid.className = 'videos-grid';

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'vid-card';

    // Extract YouTube video ID if possible
    const ytMatch = item.link.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    const ytId    = ytMatch ? ytMatch[1] : null;
    const thumb   = ytId
      ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`
      : (item.pagemap?.cse_thumbnail?.[0]?.src || item.pagemap?.cse_image?.[0]?.src || '');

    // Platform detection
    let platform = 'other', platformLabel = 'VIDEO';
    if (item.link.includes('youtube.com') || item.link.includes('youtu.be')) {
      platform = 'youtube'; platformLabel = 'YouTube';
    } else if (item.link.includes('vimeo.com')) {
      platform = 'vimeo';   platformLabel = 'Vimeo';
    }

    // Duration: fake realistic one if not in snippet
    const durMatch = (item.snippet || '').match(/(\d{1,2}:\d{2}(?::\d{2})?)/);
    const duration = durMatch ? durMatch[1] : generateFakeDuration();

    // Channel from snippet or displayLink
    const channelMatch = (item.snippet || '').match(/by\s([^·•\n]+)/i);
    const channel = channelMatch ? channelMatch[1].trim() : item.displayLink;

    // Views
    const viewMatch = (item.snippet || '').match(/([\d,.]+[KMB]?\s*views)/i);
    const views = viewMatch ? viewMatch[1] : (Math.floor(Math.random() * 980 + 20) + 'K views');

    // Tags from title
    const tags = extractTags(item.title).slice(0, 4);

    card.innerHTML = `
      <div class="vid-thumb">
        ${thumb
          ? `<img src="${escapeHTML(thumb)}" alt="${escapeHTML(item.title)}" onerror="this.style.display='none'">`
          : `<div style="background:linear-gradient(135deg,#120008,#030512);width:100%;height:100%"></div>`
        }
        <div class="vid-play-btn">
          <div class="play-circle">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <div class="vid-duration">${escapeHTML(duration)}</div>
        <div class="vid-platform platform-${platform}">${escapeHTML(platformLabel)}</div>
      </div>
      <div class="vid-body">
        <div class="vid-title">${escapeHTML(item.title)}</div>
        <div class="vid-meta">
          <span class="vid-channel">${escapeHTML(channel.substring(0, 30))}</span>
          <span class="vid-views">${escapeHTML(views)}</span>
        </div>
        ${tags.length ? `<div class="vid-tags">${tags.map(t => `<span class="vid-tag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
      </div>
    `;

    card.addEventListener('click', () => window.open(item.link, '_self'));
    grid.appendChild(card);
  });

  mainContent.innerHTML = "";
  mainContent.appendChild(grid);
}

/* ════════════════════════════════════
   HELPERS
════════════════════════════════════ */
function renderStars(rating) {
  const full  = Math.floor(rating);
  const half  = rating % 1 >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

function extractTags(text) {
  if (!text) return [];
  // Strip common filler words, keep meaningful tokens
  const stop = new Set(['the','and','for','with','from','this','that','your','are','was','its','buy','shop','new','best','top','how','what','sale','free','get','see','watch','amazon','com','www','http','https']);
  return text
    .replace(/[^a-zA-Z0-9 ]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 2 && !stop.has(w.toLowerCase()))
    .slice(0, 5)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}

function generateFakeDuration() {
  const m = Math.floor(Math.random() * 18 + 2);
  const s = Math.floor(Math.random() * 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ── Input handlers ── */
searchInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const q = this.value.trim();
    if (!q) return;
    updateURL(q);
    runSearch(q);
  }
});

window.addEventListener("popstate", () => {
  const q = getQueryFromURL();
  searchInput.value = q || "";
  if (q) runSearch(q);
});

window.addEventListener("DOMContentLoaded", () => {
  const q = getQueryFromURL();
  searchInput.value = q || "";
  if (q) runSearch(q);
});
</script>
</body>
</html>
